
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#512A91">
<title>Property Details | OGARS MARKET</title>

<style>
:root {
  --purple:#512A91;
  --dark:#38166f;
  --light:#f3edfc;
  --bg:#fbfaff;
  --text:#211b36;
  --muted:#716b83;
  --border:#e6e0f0;
  --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
}
a{text-decoration:none}
header{
  background:linear-gradient(120deg,#4d32a5,#7655d6);
  color:white;text-align:center;padding:16px;
}
header h1{font-size:23px;font-weight:900}
.container{
  width:100%;max-width:760px;margin:auto;padding:12px 14px 35px;
}
.back-button{
  display:inline-block;margin:9px 0 16px;color:var(--purple);
  text-decoration:none;font-weight:800;font-size:14px;
}
.advert-card{
  background:white;border:1px solid var(--border);
  border-radius:19px;overflow:hidden;
  box-shadow:0 4px 18px rgba(50,30,90,.07);
}

/* PHOTO GALLERY */
.photo-area{width:100%;background:var(--light)}
.main-photo-wrapper{
  position:relative;width:100%;height:300px;overflow:hidden;
  background:var(--light);touch-action:pan-y;
}
.main-photo{
  width:100%;height:100%;object-fit:contain;display:block;
  cursor:pointer;user-select:none;-webkit-user-drag:none;
}
.photo-count{
  position:absolute;top:12px;right:12px;
  background:rgba(56,22,111,.8);color:white;
  border-radius:20px;padding:6px 11px;font-size:13px;font-weight:bold;
}
.photo-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border:none;border-radius:50%;
  background:rgba(56,22,111,.65);color:white;font-size:22px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.photo-prev{left:10px}
.photo-next{right:10px}
.no-photo{
  height:210px;display:flex;align-items:center;justify-content:center;
  color:var(--purple);font-weight:bold;
}
.photo-thumbnails{
  display:flex;gap:8px;padding:9px 12px;overflow-x:auto;background:white;
}
.photo-thumb{
  width:75px;height:58px;object-fit:cover;border-radius:8px;
  cursor:pointer;border:2px solid transparent;flex-shrink:0;
}
.photo-thumb.selected{border-color:var(--purple)}

/* ADVERT CONTENT */
.content{padding:17px}
.listing-type{
  color:var(--purple);font-size:13px;font-weight:900;
  text-transform:uppercase;margin-bottom:5px;
}
.title{
  font-size:24px;line-height:1.3;color:var(--text);
  font-weight:900;margin-bottom:7px;overflow-wrap:anywhere;
}
.price{
  color:var(--purple);font-size:25px;font-weight:900;margin:8px 0 12px;
}
.location{
  color:#514b61;font-size:15px;font-weight:700;
  margin-bottom:16px;overflow-wrap:anywhere;
}

/* ADVERT FEATURES */
.features-box{
  background:#f7f3fc;border:1px solid var(--border);
  border-radius:14px;padding:14px;margin:12px 0 16px;
}
.features-box h3{
  color:var(--purple);font-size:18px;font-weight:900;margin-bottom:10px;
}
.feature-list{display:flex;flex-direction:column;gap:0}
.feature-row{
  display:flex;flex-direction:row;align-items:baseline;
  flex-wrap:wrap;gap:6px;padding:7px 0;
  border-bottom:1px solid #e7e0f0;line-height:1.45;
}
.feature-row:last-child{border-bottom:0}
.feature-label{color:var(--purple);font-size:13px;font-weight:900}
.feature-value{
  color:var(--text);font-size:14px;font-weight:700;overflow-wrap:anywhere;
}

/* DESCRIPTION */
.description-box{
  background:#f7f3fc;border:1px solid var(--border);
  border-radius:12px;padding:13px;margin-bottom:15px;
}
.description-box h3{color:var(--purple);font-size:16px;margin-bottom:7px}
.description{
  color:#514b61;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;
}

/* CONTACT BUTTONS */
.contact-section{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;margin-top:17px;
}
.contact-button{
  display:flex;align-items:center;justify-content:center;
  min-height:48px;padding:10px 7px;text-align:center;
  text-decoration:none;border-radius:10px;font-weight:900;
  font-size:13px;overflow-wrap:anywhere;
}
.call-button{background:var(--purple);color:white}
.whatsapp-button{background:#eee6fa;color:var(--dark)}
.website-button{
  grid-column:1/-1;background:#f1edf8;color:var(--purple);
  border:1px solid var(--border);
}

/* FULLSCREEN PHOTO VIEWER */
.photo-viewer{
  position:fixed;inset:0;background:rgba(0,0,0,.95);
  z-index:9999;display:none;align-items:center;justify-content:center;
  touch-action:pan-y;
}
.photo-viewer.show{display:flex}
.viewer-image{max-width:94vw;max-height:86vh;object-fit:contain;user-select:none}
.viewer-close{
  position:absolute;top:15px;right:17px;width:42px;height:42px;
  border:0;border-radius:50%;background:rgba(255,255,255,.16);
  color:white;font-size:25px;cursor:pointer;
}
.viewer-count{
  position:absolute;top:20px;left:50%;transform:translateX(-50%);
  color:white;background:rgba(0,0,0,.5);padding:5px 11px;
  border-radius:20px;font-size:13px;font-weight:bold;
}
.viewer-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:42px;height:42px;border:0;border-radius:50%;
  background:rgba(255,255,255,.17);color:white;font-size:26px;cursor:pointer;
}
.viewer-prev{left:12px}
.viewer-next{right:12px}

/* MESSAGES AND FOOTER */
.message{
  background:white;border-radius:15px;padding:35px 20px;
  text-align:center;color:var(--muted);border:1px solid var(--border);
}
.message-icon{font-size:38px;margin-bottom:10px}
.message h2{color:var(--text);margin-bottom:8px;font-size:20px}
.message p{font-size:14px;overflow-wrap:anywhere}
footer{text-align:center;padding:28px 15px;color:var(--muted);font-size:13px}

@media(max-width:480px){
  header{padding:13px}
  header h1{font-size:21px}
  .main-photo-wrapper{height:240px}
  .content{padding:14px}
  .title{font-size:21px}
  .price{font-size:23px}
  .features-box{padding:12px}
  .features-box h3{font-size:17px}
  .feature-row{gap:5px;padding:6px 0}
  .feature-label{font-size:12px}
  .feature-value{font-size:13px}
  .contact-button{min-height:45px;font-size:12px}
}
</style>
</head>

<body>

<header>
  <h1>Advert Details</h1>
</header>

<div class="container">

  <a href="find-property.html" class="back-button">
    ← Back to Properties
  </a>

  <div id="content">
    <div class="message">
      <div class="message-icon">⏳</div>
      <h2>Loading advert</h2>
      <p>Please wait...</p>
    </div>
  </div>

</div>

<footer>
  © 2026 OGARS MARKET. Ghana's Online Marketplace.
</footer>

<!-- FULLSCREEN PHOTO VIEWER -->
<div id="photo-viewer" class="photo-viewer">

  <button type="button" class="viewer-close"
    onclick="closePhotoViewer()">×</button>

  <div id="viewer-count" class="viewer-count">1 / 1</div>

  <button type="button" class="viewer-arrow viewer-prev"
    onclick="previousPhoto()">‹</button>

  <img id="viewer-image" class="viewer-image" src="" alt="Property photo">

  <button type="button" class="viewer-arrow viewer-next"
    onclick="nextPhoto()">›</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

const SUPABASE_URL="https://pawqsmcswoypuiihfbrr.supabase.co";
const SUPABASE_KEY="sb_publishable_skeGOdL2kqtHNQwXJjmSSg_exGApfnb";

const supabaseClient=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const content=document.getElementById("content");
const params=new URLSearchParams(window.location.search);
const listingId=params.get("id");

let photos=[];
let currentPhotoIndex=0;
let touchStartX=0;
let touchEndX=0;


/* SECURITY HELPER */
function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* PARSE PROPERTY INFORMATION */
function parsePropertyDescription(description){
  const features=[];
  const remaining=[];

  const lines=String(description||"").split(/\r?\n/);

  lines.forEach(line=>{
    const trimmed=line.trim();
    if(!trimmed)return;

    const match=trimmed.match(/^([^:]+):\s*(.*)$/);

    if(match&&match[1].trim()&&match[2].trim()){
      features.push({
        label:match[1].trim(),
        value:match[2].trim()
      });
    }else{
      remaining.push(trimmed);
    }
  });

  return {
    features,
    remaining:remaining.join("\n")
  };
}


/* GET FEATURE VALUE */
function getFeature(features,names){
  const found=features.find(feature=>
    names.some(name=>
      feature.label.toLowerCase().trim()===name.toLowerCase().trim()
    )
  );

  return found?found.value:"";
}


/* PROPERTY CATEGORY */
function getCategory(features){
  return getFeature(features,["Property category"])||"Property";
}


/* PROPERTY PURPOSE */
function getPurpose(category){
  if(category==="Property Wanted")return "Wanted";

  if([
    "Houses for Rent",
    "Apartments for Rent",
    "Rooms for Rent",
    "Commercial Property",
    "Short Stay / Guest House"
  ].includes(category))return "For Rent";

  if([
    "Houses for Sale",
    "Land for Sale"
  ].includes(category))return "For Sale";

  return "";
}


/* LOCATION */
function getLocation(listing,features){
  const region=getFeature(features,["Region"]);
  const town=getFeature(features,["Town / area","Town"]);
  const specific=getFeature(features,[
    "Specific location","Specific area"
  ]);

  if(region||town||specific){
    let result=region||"";

    if(town)result+=(result?", ":"")+town;
    if(specific)result+=(result?" - ":"")+specific;

    return result;
  }

  return String(listing.location||"").trim();
}


/* PRICE */
function getPrice(features){
  const priceFields=[
    ["Rent amount (GH₵)","Rent"],
    ["Asking price (GH₵)","Asking price"],
    ["Nightly rate (GH₵)","Nightly rate"],
    ["Budget (GH₵)","Budget"]
  ];

  for(const [label,type] of priceFields){
    const value=getFeature(features,[label]);

    if(value){
      const number=Number(
        String(value).replace(/,/g,"").replace(/[^\d.]/g,"")
      );

      const display=Number.isFinite(number)
        ?"GH₵ "+number.toLocaleString("en-GH")
        :"GH₵ "+value;

      return {display,type};
    }
  }

  return {display:"",type:""};
}


/* PHOTO URLS */
function getPropertyPhotos(listing){
  if(!listing.photo_urls)return [];

  if(Array.isArray(listing.photo_urls)){
    return listing.photo_urls
      .map(url=>String(url).trim())
      .filter(url=>/^https?:\/\//i.test(url));
  }

  const raw=String(listing.photo_urls).trim();

  if(raw.startsWith("[")){
    try{
      const parsed=JSON.parse(raw);

      if(Array.isArray(parsed)){
        return parsed
          .map(url=>String(url).trim())
          .filter(url=>/^https?:\/\//i.test(url));
      }
    }catch(error){
      console.warn("Photo list parsing:",error);
    }
  }

  return raw.split(",")
    .map(url=>url.trim())
    .filter(url=>/^https?:\/\//i.test(url));
}


/* FEATURES TO SHOW IN THE PANEL */
function getVisibleFeatures(features){
  const hidden=[
    "property category",
    "region",
    "town / area",
    "town",
    "specific location",
    "specific area",
    "rent amount (gh₵)",
    "asking price (gh₵)",
    "nightly rate (gh₵)",
    "budget (gh₵)"
  ];

  return features.filter(feature=>
    !hidden.includes(feature.label.toLowerCase().trim())
  );
}


/* PRICE PERIOD */
function getPricePeriod(features,category,priceType){
  if(priceType==="Nightly rate")return " / night";

  const period=getFeature(features,[
    "Payment period",
    "Advance payment / duration"
  ]);

  return period?" / "+period:"";
}


/* FEATURE ROW */
function featureRow(label,value){
  if(!value)return "";

  return `
    <div class="feature-row">
      <span class="feature-label">${escapeHtml(label)}</span>
      <span class="feature-value">${escapeHtml(value)}</span>
    </div>
  `;
}


/* LOAD ADVERT */
async function loadAdvert(){

  if(!listingId){
    showMessage(
      "⚠️",
      "Advert Not Found",
      "No advert ID was provided. Please return to Property listings."
    );
    return;
  }

  try{
    const {data:listing,error}=await supabaseClient
      .from("discover_listings")
      .select("*")
      .eq("id",listingId)
      .eq("listing_type","Property")
      .maybeSingle();

    if(error)throw error;

    if(!listing){
      showMessage(
        "🔎",
        "Property Not Found",
        "This property may have been removed or is no longer available."
      );
      return;
    }

    renderAdvert(listing);

  }catch(error){
    console.error("OGARS Property Details Error:",error);

    showMessage(
      "⚠️",
      "Unable to Load Property",
      error.message||"Please try again."
    );
  }
}


/* RENDER ADVERT */
function renderAdvert(listing){

  photos=getPropertyPhotos(listing);
  currentPhotoIndex=0;

  const parsed=parsePropertyDescription(listing.description);
  const features=parsed.features;

  const category=getCategory(features);
  const purpose=getPurpose(category);
  const location=getLocation(listing,features);
  const price=getPrice(features);
  const period=getPricePeriod(features,category,price.type);

  const title=listing.title||"Property Advert";

  /* PHOTO GALLERY */
  let photoHtml="";

  if(photos.length){
    photoHtml=`
      <div class="photo-area">

        <div class="main-photo-wrapper" id="main-photo-wrapper">

          <img
            id="main-photo"
            class="main-photo"
            src="${escapeHtml(photos[0])}"
            alt="${escapeHtml(title)}"
            fetchpriority="high"
            onclick="openPhotoViewer()"
          >

          ${photos.length>1?`
            <div id="photo-count" class="photo-count">
              1 / ${photos.length}
            </div>

            <button type="button"
              class="photo-arrow photo-prev"
              onclick="previousPhoto()"
              aria-label="Previous photo">‹</button>

            <button type="button"
              class="photo-arrow photo-next"
              onclick="nextPhoto()"
              aria-label="Next photo">›</button>
          `:""}

        </div>

        ${photos.length>1?`
          <div class="photo-thumbnails">
            ${photos.map((photo,index)=>`
              <img
                src="${escapeHtml(photo)}"
                class="photo-thumb ${index===0?"selected":""}"
                onclick="showPhoto(${index})"
                alt="Property photo ${index+1}"
                loading="lazy"
              >
            `).join("")}
          </div>
        `:""}

      </div>
    `;
  }else{
    photoHtml=`
      <div class="photo-area">
        <div class="no-photo">📷 No Photo Available</div>
      </div>
    `;
  }


  /* FEATURES */
  const visibleFeatures=getVisibleFeatures(features);

  const featuresHtml=visibleFeatures.length?`
    <div class="features-box">
      <h3>Advert Features &amp; Information</h3>

      <div class="feature-list">
        ${visibleFeatures.map(feature=>
          featureRow(feature.label,feature.value)
        ).join("")}

        ${purpose?featureRow("Advert purpose",purpose):""}
      </div>
    </div>
  `:"";


  /* CONTACT */
  let contactHtml="";

  const phone=String(listing.phone||"").trim();

  let whatsapp=String(
    listing.whatsapp||listing.phone||""
  ).replace(/\D/g,"");

  if(whatsapp.startsWith("0")){
    whatsapp="233"+whatsapp.substring(1);
  }

  if(phone){
    contactHtml+=`
      <a class="contact-button call-button"
        href="tel:${escapeHtml(phone)}">
        📞 Call
      </a>
    `;
  }

  if(whatsapp){
    const message=
      "Hello, I saw your property advert \""+
      title+
      "\" on OGARS MARKET. I would like to make an enquiry. Please can you give me more information?";

    const url="https://wa.me/"+whatsapp+
      "?text="+encodeURIComponent(message);

    contactHtml+=`
      <a class="contact-button whatsapp-button"
        href="${escapeHtml(url)}"
        target="_blank"
        rel="noopener noreferrer">
        💬 WhatsApp
      </a>
    `;
  }


  /* WEBSITE */
  let websiteHtml="";

  if(listing.website){
    let website=String(listing.website).trim();

    if(!/^https?:\/\//i.test(website)){
      website="https://"+website;
    }

    websiteHtml=`
      <a class="contact-button website-button"
        href="${escapeHtml(website)}"
        target="_blank"
        rel="noopener noreferrer">
        🌐 Visit Website
      </a>
    `;
  }


  /* DESCRIPTION */
  const description=parsed.remaining;

  const descriptionHtml=description?`
    <div class="description-box">
      <h3>📝 Description</h3>
      <div class="description">${escapeHtml(description)}</div>
    </div>
  `:"";


  /* FINAL PAGE */
  content.innerHTML=`
    <div class="advert-card">

      ${photoHtml}

      <div class="content">

        <div class="listing-type">
          ${escapeHtml(category)}
        </div>

        <h2 class="title">
          ${escapeHtml(title)}
        </h2>

        ${price.display?`
          <div class="price">
            ${escapeHtml(price.display)}
            ${period?`<span style="font-size:15px">${escapeHtml(period)}</span>`:""}
          </div>
        `:""}

        ${location?`
          <div class="location">
            📍 ${escapeHtml(location)}
          </div>
        `:""}

        ${featuresHtml}

        ${descriptionHtml}

        ${contactHtml||websiteHtml?`
          <div class="contact-section">
            ${contactHtml}
            ${websiteHtml}
          </div>
        `:""}

      </div>
    </div>
  `;

  setupSwipe();
  preloadNearbyPhotos();
}


/* PRELOAD PHOTOS */
function preloadNearbyPhotos(){
  if(photos.length<=1)return;

  [currentPhotoIndex+1,currentPhotoIndex-1].forEach(index=>{
    if(index>=0&&index<photos.length){
      const image=new Image();
      image.src=photos[index];
    }
  });
}


/* SHOW PHOTO */
function showPhoto(index){
  if(!photos.length)return;

  if(index<0)index=photos.length-1;
  if(index>=photos.length)index=0;

  currentPhotoIndex=index;

  const mainPhoto=document.getElementById("main-photo");

  if(mainPhoto){
    mainPhoto.src=photos[index];
  }

  const count=document.getElementById("photo-count");

  if(count){
    count.textContent=(index+1)+" / "+photos.length;
  }

  document.querySelectorAll(".photo-thumb").forEach((thumb,i)=>{
    thumb.classList.toggle("selected",i===index);
  });

  const thumbnail=document.querySelectorAll(".photo-thumb")[index];

  if(thumbnail){
    thumbnail.scrollIntoView({
      behavior:"smooth",
      block:"nearest",
      inline:"center"
    });
  }

  const viewer=document.getElementById("photo-viewer");

  if(viewer.classList.contains("show")){
    updateViewer();
  }

  preloadNearbyPhotos();
}

function nextPhoto(){
  if(photos.length>1)showPhoto(currentPhotoIndex+1);
}

function previousPhoto(){
  if(photos.length>1)showPhoto(currentPhotoIndex-1);
}


/* FULLSCREEN VIEWER */
function openPhotoViewer(){
  if(!photos.length)return;

  document.getElementById("photo-viewer").classList.add("show");
  document.body.style.overflow="hidden";

  updateViewer();
}

function closePhotoViewer(){
  document.getElementById("photo-viewer").classList.remove("show");
  document.body.style.overflow="";
}

function updateViewer(){
  const image=document.getElementById("viewer-image");
  const count=document.getElementById("viewer-count");

  if(!image||!count||!photos.length)return;

  image.src=photos[currentPhotoIndex];
  count.textContent=(currentPhotoIndex+1)+" / "+photos.length;
}


/* SWIPE SUPPORT */
function handleSwipe(){
  const difference=touchStartX-touchEndX;

  if(Math.abs(difference)<50)return;

  if(difference>0)nextPhoto();
  else previousPhoto();
}

function setupSwipe(){
  const wrapper=document.getElementById("main-photo-wrapper");

  if(!wrapper)return;

  wrapper.addEventListener("touchstart",event=>{
    touchStartX=event.changedTouches[0].screenX;
  },{passive:true});

  wrapper.addEventListener("touchend",event=>{
    touchEndX=event.changedTouches[0].screenX;
    handleSwipe();
  },{passive:true});
}


/* VIEWER SWIPE */
const viewer=document.getElementById("photo-viewer");

viewer.addEventListener("touchstart",event=>{
  touchStartX=event.changedTouches[0].screenX;
},{passive:true});

viewer.addEventListener("touchend",event=>{
  touchEndX=event.changedTouches[0].screenX;
  handleSwipe();
},{passive:true});


/* KEYBOARD CONTROLS */
document.addEventListener("keydown",event=>{
  const viewerElement=document.getElementById("photo-viewer");

  if(!viewerElement.classList.contains("show"))return;

  if(event.key==="ArrowRight")nextPhoto();
  if(event.key==="ArrowLeft")previousPhoto();
  if(event.key==="Escape")closePhotoViewer();
});


/* ERROR MESSAGE */
function showMessage(icon,title,message){
  content.innerHTML=`
    <div class="message">
      <div class="message-icon">${escapeHtml(icon)}</div>
      <h2>${escapeHtml(title)}</h2>
      <p>${escapeHtml(message)}</p>
      <p style="margin-top:15px">
        <a href="find-property.html"
          style="color:#512A91;font-weight:bold">
          ← Back to Properties
        </a>
      </p>
    </div>
  `;
}


/* START */
loadAdvert();

</script>

</body>
</html>
