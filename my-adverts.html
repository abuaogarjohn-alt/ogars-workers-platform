<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Adverts | OGARS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f5;
      color: #1f2937;
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, #006b00, #008f00);
      color: white;
      padding: 22px 18px 28px;
      text-align: center;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      opacity: 0.92;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: 18px 14px 35px;
    }

    .account-panel {
      background: white;
      border-radius: 16px;
      padding: 17px;
      margin-top: -4px;
      margin-bottom: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.07);
      border: 1px solid #e5e7eb;
    }

    .account-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .account-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #e9f7e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      flex-shrink: 0;
    }

    .account-info {
      min-width: 0;
    }

    .account-title {
      font-weight: bold;
      color: #111827;
      font-size: 15px;
    }

    .account-email {
      color: #6b7280;
      font-size: 13px;
      word-break: break-word;
      margin-top: 2px;
    }

    .top-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 15px;
    }

    .action-button {
      border: none;
      border-radius: 9px;
      padding: 12px 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .create-button {
      background: #008000;
      color: white;
    }

    .logout-button {
      background: #f1f3f2;
      color: #555;
      border: 1px solid #ddd;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 22px 2px 12px;
    }

    .section-heading h2 {
      font-size: 20px;
      color: #111827;
    }

    .listing-count {
      background: #e8f6e8;
      color: #087408;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .listing-card {
      background: white;
      border-radius: 17px;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 3px 15px rgba(0,0,0,0.07);
    }

    .photo-wrapper {
      position: relative;
      width: 100%;
      height: 220px;
      background: #edf4ed;
    }

    .listing-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .no-photo {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #008000;
      font-size: 15px;
      font-weight: bold;
    }

    .listing-content {
      padding: 17px;
    }

    .listing-type {
      color: #008000;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .listing-title {
      font-size: 20px;
      color: #111827;
      margin-bottom: 7px;
      line-height: 1.3;
    }

    .listing-description {
      color: #606770;
      font-size: 14px;
      margin-bottom: 13px;
    }

    .expiry-box {
      background: #f7f9f7;
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 13px;
      color: #555;
      margin-bottom: 13px;
    }

    .expiry-box strong {
      color: #222;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .card-button {
      border: none;
      border-radius: 9px;
      padding: 12px 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .view-button {
      background: #eef5ee;
      color: #087408;
    }

    .edit-button {
      background: #f1f5f1;
      color: #087408;
      border: 1px solid #cfe3cf;
    }

    .renew-button {
      background: #008000;
      color: white;
    }

    .renew-button:hover {
      background: #006b00;
    }

    .renew-button:disabled {
      background: #e9f7e9;
      color: #087408;
      border: 1px solid #b9dfb9;
      cursor: default;
    }

    .message {
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      color: #666;
      border: 1px solid #e5e7eb;
      box-shadow: 0 3px 15px rgba(0,0,0,0.05);
    }

    .message-icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .message h3 {
      color: #222;
      margin-bottom: 7px;
    }

    .message p {
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #008000;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 480px) {

      header h1 {
        font-size: 24px;
      }

      .photo-wrapper {
        height: 195px;
      }

      .listing-title {
        font-size: 18px;
      }

      .card-actions {
        grid-template-columns: 1fr 1fr;
      }

    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    OGAR'S WORKERS PLATFORM
  </div>

  <h1>My Adverts</h1>

  <p>
    Manage, edit and renew your Discover & Advertise listings
  </p>

</header>


<div class="container">

  <div class="account-panel">

    <div class="account-top">

      <div class="account-icon">
        👤
      </div>

      <div class="account-info">

        <div class="account-title">
          My OGARS Account
        </div>

        <div
          class="account-email"
          id="account-email"
        >
          Checking account...
        </div>

      </div>

    </div>


    <div class="top-actions">

      <button
        class="action-button create-button"
        id="advertise-button"
      >
        ➕ New Advert
      </button>

      <button
        class="action-button logout-button"
        id="logout-button"
      >
        Logout
      </button>

    </div>

  </div>


  <div class="section-heading">

    <h2>
      Your Adverts
    </h2>

    <span
      class="listing-count"
      id="listing-count"
    >
      0 Listings
    </span>

  </div>


  <div id="listings-container">

    <div class="message">

      <div class="message-icon">
        ⏳
      </div>

      <h3>
        Loading your adverts
      </h3>

      <p>
        Please wait...
      </p>

    </div>

  </div>


  <a
    href="account.html"
    class="back"
  >
    ← Back to My Account
  </a>

</div>


<footer>
  © 2026 OGARS Workers Platform
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://pawqsmcswoypuiihfbrr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_skeGOdL2kqtHNQwXJjmSSg_exGApfnb";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const accountEmail =
  document.getElementById(
    "account-email"
  );

const listingsContainer =
  document.getElementById(
    "listings-container"
  );

const listingCount =
  document.getElementById(
    "listing-count"
  );

const advertiseButton =
  document.getElementById(
    "advertise-button"
  );

const logoutButton =
  document.getElementById(
    "logout-button"
  );


/* NEW ADVERT */

advertiseButton.addEventListener(
  "click",
  function () {

    window.location.href =
      "advertise.html";

  }
);


/* LOGOUT */

logoutButton.addEventListener(
  "click",
  async function () {

    const result =
      await supabaseClient.auth.signOut();

    if (result.error) {

      alert(
        "Unable to log out:\n\n" +
        result.error.message
      );

      return;
    }

    window.location.href =
      "account.html";

  }
);


/* LOAD MY ADVERTS */

async function loadMyAdverts() {

  const userResult =
    await supabaseClient.auth.getUser();

  const user =
    userResult.data.user;


  if (!user) {

    window.location.href =
      "account.html";

    return;

  }


  accountEmail.textContent =
    user.email;


  const result =
    await supabaseClient
      .from("discover_listings")
      .select("*")
      .eq("user_id", user.id)
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (result.error) {

    listingsContainer.innerHTML = `

      <div class="message">

        <div class="message-icon">
          ⚠️
        </div>

        <h3>
          Unable to load adverts
        </h3>

        <p>
          ${escapeHtml(
            result.error.message
          )}
        </p>

      </div>

    `;

    return;

  }


  const listings =
    result.data || [];


  listingCount.textContent =
    listings.length +
    (
      listings.length === 1
        ? " Listing"
        : " Listings"
    );


  if (listings.length === 0) {

    listingsContainer.innerHTML = `

      <div class="message">

        <div class="message-icon">
          📢
        </div>

        <h3>
          No adverts yet
        </h3>

        <p>
          You haven't published any Discover & Advertise listings yet.
        </p>

      </div>

    `;

    return;

  }


  listingsContainer.innerHTML =
    "";


  listings.forEach(
    function (listing) {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "listing-card";


      /* PHOTO */

      let photoHtml =
        `

        <div class="photo-wrapper">

          <div class="no-photo">
            📷 No Photo
          </div>

        </div>

        `;


      if (
        listing.photo_urls &&
        listing.photo_urls.trim() !== ""
      ) {

        const firstPhoto =
          listing.photo_urls
            .split(",")[0]
            .trim();


        if (firstPhoto) {

          photoHtml = `

            <div class="photo-wrapper">

              <img
                src="${escapeAttribute(
                  firstPhoto
                )}"
                class="listing-photo"
                alt="Advert photo"
              >

            </div>

          `;

        }

      }


      /* EXPIRY */

      const now =
        new Date();

      const expiryDate =
        listing.expires_at
          ? new Date(
              listing.expires_at
            )
          : null;

      const isExpired =
        !expiryDate ||
        expiryDate <= now;


      const statusText =
        isExpired
          ? "Expired"
          : "Active";


      let expiryText;


      if (expiryDate) {

        expiryText =
          isExpired
            ? "Expired on: "
            : "Expires on: ";

        expiryText +=
          expiryDate.toLocaleString();

      } else {

        expiryText =
          "Expiry date unavailable";

      }


      /* CARD */

      card.innerHTML = `

        ${photoHtml}

        <div class="listing-content">

          <div class="listing-type">

            ${escapeHtml(
              listing.listing_type ||
              "Advertisement"
            )}

          </div>

          <h2 class="listing-title">

            ${escapeHtml(
              listing.title ||
              "Untitled Advert"
            )}

          </h2>

          <div class="listing-description">

            ${escapeHtml(
              listing.description ||
              "No description provided."
            )}

          </div>

          <div class="expiry-box">

            <strong>
              ${statusText}
            </strong>

            <br>

            ${escapeHtml(
              expiryText
            )}

          </div>

          <div class="card-actions">

            <a
              class="card-button view-button"
              href="discover-details.html?id=${encodeURIComponent(
                listing.id
              )}"
            >
              👁 View Advert
            </a>

            <a
              class="card-button edit-button"
              href="edit-discover.html?id=${encodeURIComponent(
                listing.id
              )}"
            >
              ✏️ Edit Advert
            </a>

          </div>

          <div
            style="
              margin-top:9px;
            "
          >

            ${
              isExpired
                ? `
                  <button
                    class="card-button renew-button"
                    style="width:100%;"
                    onclick="renewAdvert('${escapeAttribute(
                      listing.id
                    )}', this)"
                  >
                    🔄 Renew 30 Days
                  </button>
                `
                : `
                  <button
                    class="card-button renew-button"
                    style="width:100%;"
                    disabled
                  >
                    ✓ Active
                  </button>
                `
            }

          </div>

        </div>

      `;


      listingsContainer.appendChild(
        card
      );

    }
  );

}


/* REAL SECURE RENEWAL */

async function renewAdvert(
  listingId,
  button
) {

  if (!listingId || !button) {
    return;
  }


  const confirmed =
    confirm(
      "Renew this advert for another 30 days?"
    );


  if (!confirmed) {
    return;
  }


  const originalText =
    button.innerHTML;


  button.disabled = true;

  button.innerHTML =
    "⏳ Renewing...";


  const userResult =
    await supabaseClient.auth.getUser();

  const user =
    userResult.data.user;


  if (!user) {

    alert(
      "Your session has expired. Please log in again."
    );

    window.location.href =
      "account.html";

    return;

  }


  const result =
    await supabaseClient.rpc(
      "renew_discover_listing",
      {
        p_listing_id: listingId
      }
    );


  if (result.error) {

    console.error(
      "Renewal error:",
      result.error
    );

    button.disabled = false;

    button.innerHTML =
      originalText;


    alert(
      "Unable to renew this advert.\n\n" +
      result.error.message
    );

    return;

  }


  if (!result.data) {

    button.disabled = false;

    button.innerHTML =
      originalText;


    alert(
      "The advert could not be renewed."
    );

    return;

  }


  alert(
    "✅ Your advert has been renewed for another 30 days!"
  );


  await loadMyAdverts();

}


/* SECURITY HELPERS */

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}


/* START */

loadMyAdverts();

</script>

</body>
</html>
