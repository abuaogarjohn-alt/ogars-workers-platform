<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Jobs & Employment | OGARS Platform</title><style>
:root{--purple:#6818c9;--dark:#421078;--lav:#efe2ff;--lav2:#e5d0ff;--ink:#17112f;--muted:#635a78}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5edff;color:var(--ink)}button,input,select{font:inherit}a{text-decoration:none;color:inherit}.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:22px 16px;background:linear-gradient(110deg,#7620df,#5b18ad 52%,#401071);color:white;min-height:145px}.back{font-size:28px;color:white}.hero-icon{flex:0 0 78px;width:78px;height:78px;border:3px solid white;border-radius:22px;display:grid;place-items:center}.hero-icon svg{width:48px;height:48px}.hero-text{z-index:1;min-width:0}.hero h1{font-size:clamp(20px,4.8vw,30px);line-height:1.08;margin:0 0 9px;font-weight:800}.hero p{font-size:15px;margin:0;color:#f4eaff}.watermark{position:absolute;right:5%;top:12px;width:115px;height:115px;opacity:.12}main{max-width:900px;margin:auto;padding:18px 15px 105px;background:linear-gradient(#f2e7ff,#f8f2ff)}.search-panel{background:#e9d8ff;border:1px solid #e4d0ff;border-radius:27px;padding:15px}.search-input{width:100%;height:56px;border:1px solid #eee8f5;border-radius:23px;background:white;padding:0 19px;font-size:15px;outline:none}.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}select{width:100%;min-width:0;height:53px;padding:0 10px;border:1px solid #eee8f5;border-radius:20px;background:#fff;color:#211936;font-size:13px}.search-button{width:100%;height:57px;margin-top:12px;border:0;border-radius:20px;background:linear-gradient(100deg,#6413c3,#4b168e);color:#fff;font-size:17px;font-weight:800}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:25px 5px 7px}.section-heading h2{font-size:21px;line-height:1.15;margin:0}.all-jobs{color:#6715c3;font-size:15px;font-weight:800;white-space:nowrap}.subtitle{margin:0 5px 17px;color:var(--muted);font-size:15px;line-height:1.4}.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.category{min-width:0;overflow:hidden;border:1px solid #e2d3f6;border-radius:24px;background:#fff;box-shadow:0 3px 5px #4210780c;display:flex;flex-direction:column;align-items:center;padding:12px 6px 14px;min-height:143px;color:var(--ink);cursor:pointer}.cat-picture{width:100%;max-width:100px;height:72px;background:linear-gradient(135deg,#f1e3ff,#e7d3ff);border-radius:22px;display:grid;place-items:center;margin-bottom:7px;color:#6818c9}.cat-picture svg{width:55px;height:55px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.category:nth-child(3n+2) .cat-picture{color:#4e16a0}.category:nth-child(3n) .cat-picture{color:#7725d3}.cat-title{font-size:13px;font-weight:800;line-height:1.18;text-align:center}.bottom-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:78px;padding:7px 5px calc(7px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e7dff0;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav-item{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#5e5670;font-size:11px}.nav-item svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nav-item.active{color:#6415bd;font-weight:800}.nav-sell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#5e5670;font-size:11px}.sell-circle{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#6414c3;color:white;margin-top:-26px;border:0;box-shadow:none;outline:none}.sell-circle svg{width:30px;height:30px;stroke:white;stroke-width:3;fill:none;stroke-linecap:round}@media(min-width:620px){.hero{padding:25px max(25px,calc((100vw - 860px)/2))}.watermark{right:calc((100vw - 850px)/2)}main{padding:22px 22px 110px}.category-grid{gap:14px}.category{min-height:170px}.cat-picture{max-width:150px;height:88px}.cat-picture svg{width:64px;height:64px}}@media(max-width:360px){.hero{gap:8px;padding:18px 9px}.hero-icon{flex-basis:62px;width:62px;height:62px}.hero h1{font-size:19px}.hero p{font-size:13px}.cat-title{font-size:11px}.category{min-height:128px;padding:9px 4px}.filter-row{gap:6px}select{font-size:11px;padding:0 5px}}
</style></head><body>
<header class="hero"><a class="back" href="index.html" aria-label="Back to home">‹</a><div class="hero-icon" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="8" y="20" width="48" height="34" rx="5"/><path d="M22 20v-7a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v7M8 31c13 8 35 8 48 0M28 32h8v7h-8z"/></svg></div><div class="hero-text"><h1>OGARS JOBS &amp; EMPLOYMENT</h1><p>Find your next job in Ghana</p></div><svg class="watermark" viewBox="0 0 64 64"><rect x="8" y="20" width="48" height="34" rx="5" fill="none" stroke="white" stroke-width="4"/><path d="M22 20v-7a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v7M8 31c13 8 35 8 48 0M28 32h8v7h-8z" fill="none" stroke="white" stroke-width="4"/></svg></header>
<main><section class="search-panel"><input class="search-input" id="jobSearch" type="search" placeholder="Search job title, company or skill..." aria-label="Search job title, company or skill"><div class="filter-row"><select id="region" aria-label="Choose region"><option value="">📍 All Ghana</option><option>Greater Accra</option><option>Ashanti</option><option>Western</option><option>Central</option><option>Eastern</option><option>Volta</option><option>Northern</option><option>Upper East</option><option>Upper West</option><option>Bono</option><option>Bono East</option><option>Ahafo</option><option>Western North</option><option>Oti</option><option>Savannah</option><option>North East</option></select><select id="employmentType" aria-label="Employment type"><option value="">All Employment Types</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Temporary</option><option>Internship</option><option>Casual/Daily work</option><option>Remote/Work from home</option></select></div><button class="search-button" id="searchButton">⌕ &nbsp; Search Jobs</button></section>
<div class="section-heading"><h2>Browse Job Categories</h2><a class="all-jobs" href="#jobListings">All Jobs →</a></div><p class="subtitle">Find the right job and explore opportunities.</p>
<section class="category-grid" aria-label="Job categories">
<button class="category" data-category="Office & Administration"><span class="cat-picture"><svg viewBox="0 0 64 64"><path d="M12 55h40M17 55V24h30v31M25 24v-8h14v8M23 33h5M36 33h5M23 42h5M36 42h5M29 55V46h7v9"/></svg></span><span class="cat-title">Office &amp; Administration</span></button>
<button class="category" data-category="Driving & Transport"><span class="cat-picture"><svg viewBox="0 0 64 64"><path d="M10 38l4-14a5 5 0 0 1 5-4h26a5 5 0 0 1 5 4l4 14v11H10zM14 37h36M18 49v5M46 49v5M18 43h5M41 43h5M22 20l3-7h14l3 7"/></svg></span><span class="cat-title">Driving &amp; Transport</span></button>
<button class="category" data-category="Hospitality & Catering"><span class="cat-picture"><svg viewBox="0 0 64 64"><path d="M13 9v20M7 9v11a6 6 0 0 0 12 0V9M13 29v26M39 9v46M39 9c11 7 13 19 0 23"/></svg></span><span class="cat-title">Hospitality &amp; Catering</span></button>
<button class="category" data-category="Sales & Customer Service"><span class="cat-picture"><svg viewBox="0 0 64 64"><path d="M8 27h48L51 14H13zM12 27v27h40V27M8 27h48M20 54V39h12v15M19 19h1M31 19h1M43 19h1"/></svg></span><span class="cat-title">Sales &amp; Customer Service</span></button>
<button class="category" data-category="Construction & Technical"><span class="cat-picture"><svg viewBox="0 0 64 64"><path d="M13 49l27-27M34 15l6-6 14 14-6 6M10 52l8 3 5-5-8-8zM37 32l-5-5"/></svg></span><span class="cat-title">Construction &amp; Technical</span></button>
<button class="category" data-category="Education & Care"><span class="cat-picture"><svg viewBox="0 0 64 64"><path d="M8 22l24-12 24 12-24 12zM17 28v13c9 8 23 8 30 0V28M56 22v17M52 43h8"/></svg></span><span class="cat-title">Education &amp; Care</span></button>
<button class="category" data-category="Warehouse & Logistics"><span class="cat-picture"><svg viewBox="0 0 64 64"><path d="M10 25h21v20H10zM33 14h21v20H33zM33 37h21v20H33zM14 30h13M37 19h13M37 42h13M10 49h21"/></svg></span><span class="cat-title">Warehouse &amp; Logistics</span></button>
<button class="category" data-category="IT & Creative Work"><span class="cat-picture"><svg viewBox="0 0 64 64"><rect x="8" y="10" width="48" height="34" rx="3"/><path d="M4 52h56M22 44l-3 8M42 44l3 8M25 21l-7 6 7 6M39 21l7 6-7 6M36 20l-7 14"/></svg></span><span class="cat-title">IT &amp; Creative Work</span></button>
<button class="category" data-category=""><span class="cat-picture"><svg viewBox="0 0 64 64"><circle cx="32" cy="18" r="8"/><circle cx="13" cy="25" r="6"/><circle cx="51" cy="25" r="6"/><path d="M16 52V43a16 16 0 0 1 32 0v9zM2 50v-7a11 11 0 0 1 9-11M62 50v-7a11 11 0 0 0-9-11"/></svg></span><span class="cat-title">All Jobs</span></button></section>
<section id="jobListings" style="margin-top:28px"><h2 style="font-size:20px;margin:0 0 10px">Job Vacancies</h2><p id="status" style="font-size:13px;color:#635a78">Connect the job listings database to display current vacancies.</p><div id="jobs"></div></section></main>
<nav class="bottom-nav" aria-label="Main navigation"><a class="nav-item active" href="index.html"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V21H3z"/></svg><span>Home</span></a><a class="nav-item" href="discover.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>Explore</span></a><a class="nav-sell" href="products.html"><span class="sell-circle"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></span><span>Sell</span></a><a class="nav-item" href="ai-search.html"><svg viewBox="0 0 24 24"><path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></svg><span>AI Search</span></a><a class="nav-item" href="account.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/></svg><span>Account</span></a></nav>
<script>let selectedCategory="";document.querySelectorAll('.category').forEach(button=>button.addEventListener('click',()=>{selectedCategory=button.dataset.category;document.querySelectorAll('.category').forEach(card=>{card.style.borderColor=card===button?'#8a43d5':'#e2d3f6'});document.getElementById('jobSearch').value=selectedCategory}));document.getElementById('searchButton').addEventListener('click',()=>{document.getElementById('jobListings').scrollIntoView({behavior:'smooth'});document.getElementById('status').textContent='Search selected. Connect the actual jobs database to show matching vacancies.'});</script></body></html>
