<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs & Employment | OGARS Platform</title>
<style>
:root{--purple:#542b91;--purple2:#6722ca;--lavender:#f1e7ff;--lavender2:#e8d8fb;--ink:#19152f;--muted:#777188;--line:#e5dcf0;--white:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--ink)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
.hero{height:210px;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:18px 20px;background:linear-gradient(110deg,#7022d2 0%,#51218f 100%);color:#fff}
.back{flex:0 0 auto;font-size:30px;line-height:1;color:white;padding:0 1px}
.hero-icon{flex:0 0 80px;width:80px;height:80px;border:3px solid #fff;border-radius:22px;display:grid;place-items:center;position:relative;z-index:1}
.hero-icon svg{width:47px;height:47px;stroke:white;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.hero-copy{position:relative;z-index:1;min-width:0}
.hero h1{font-size:27px;line-height:1.03;font-weight:800;margin:0 0 10px;letter-spacing:-.5px}
.hero p{font-size:15px;line-height:1.35;margin:0;color:#f3eaff}
.watermark{position:absolute;right:4%;top:8px;width:145px;height:145px;opacity:.12;stroke:#fff;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
main{max-width:900px;margin:0 auto;padding:18px 19px 112px;background:#fff}
.search-panel{padding:15px 15px 16px;background:var(--lavender);border:1px solid #e7daf8;border-radius:28px;box-shadow:0 8px 18px rgba(62,25,108,.07)}
.search-input{display:block;width:100%;height:59px;padding:0 20px;border:1px solid #e8e2ef;border-radius:21px;background:#fff;color:var(--ink);font-size:15px;outline:none}
.search-input:focus{border-color:#a77bdf}
.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
select{width:100%;min-width:0;height:58px;padding:0 13px;border:1px solid #e7e1ef;border-radius:19px;background:#fff;color:#302a3e;font-size:14px;outline:none}
.search-button{display:block;width:100%;height:59px;margin-top:12px;border:0;border-radius:18px;background:#542b91;color:white;font-size:17px;font-weight:800;cursor:pointer}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:25px 2px 0}
.section-head h2{font-size:21px;line-height:1.18;font-weight:800;margin:0;letter-spacing:-.45px}
.all-jobs{flex:0 0 auto;padding-top:2px;color:#5e2aa2;font-size:15px;line-height:1.25;font-weight:800;white-space:nowrap}
.section-subtitle{font-size:15px;line-height:1.5;color:var(--muted);margin:13px 2px 19px}
.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.category{min-width:0;display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:10px 10px 14px;background:#fff;border:1px solid #e5dcef;border-radius:25px;box-shadow:0 4px 12px rgba(50,26,80,.06);color:var(--ink);cursor:pointer;overflow:hidden}
.category:focus-visible{outline:2px solid #7a40bd;outline-offset:2px}
.cat-picture{display:block;width:100%;height:122px;overflow:hidden;margin-bottom:11px;border-radius:18px;background:linear-gradient(145deg,#f1e5ff,#f8f2ff)}
.cat-picture img{display:block;width:100%;height:100%;object-fit:cover}
.cat-title{font-size:14px;line-height:1.25;font-weight:800;margin:0 2px 6px}
.cat-desc{font-size:12px;line-height:1.4;color:var(--muted);margin:0 2px}

.job-listings{margin-top:31px}
.job-listings h2{font-size:21px;margin:0 0 10px}
.status{font-size:13px;line-height:1.5;color:var(--muted);margin:0}
.bottom-nav{position:fixed;z-index:10;left:0;right:0;bottom:0;min-height:78px;padding:7px 5px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid #eee8f4;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav-item{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#777187;font-size:11px}
.nav-item svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:#542b91;font-weight:800}
.nav-sell{height:66px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;color:#777187;font-size:11px}
.sell-circle{width:54px;height:54px;margin-top:-22px;border-radius:50%;background:#6420c1;color:#fff;display:grid;place-items:center;box-shadow:none;border:0;outline:none}
.sell-circle svg{width:29px;height:29px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round}
@media(min-width:620px){.hero{padding-left:max(25px,calc((100vw - 860px)/2));padding-right:max(25px,calc((100vw - 860px)/2))}.watermark{right:calc((100vw - 850px)/2)}main{padding:22px 22px 115px}.cat-picture{height:150px}.cat-picture svg{width:88px;height:88px}.category{padding:12px 12px 16px}.cat-title{font-size:15px}.cat-desc{font-size:13px}}
@media(max-width:380px){.hero{height:190px;padding:15px 10px;gap:8px}.back{font-size:26px}.hero-icon{flex-basis:66px;width:66px;height:66px;border-radius:18px}.hero-icon svg{width:39px;height:39px}.hero h1{font-size:21px}.hero p{font-size:13px}.watermark{width:110px;height:110px;right:1%}main{padding:16px 13px 108px}.search-panel{padding:12px;border-radius:25px}.search-input{height:54px;padding:0 15px;font-size:14px}.filter-row{gap:8px}select{height:55px;padding:0 8px;font-size:12px;border-radius:17px}.search-button{height:56px;font-size:16px}.section-head h2{font-size:19px}.all-jobs{font-size:13px}.section-subtitle{font-size:14px;margin-top:11px;margin-bottom:16px}.category-grid{gap:9px}.category{padding:7px 7px 11px;border-radius:22px}.cat-picture{height:90px;border-radius:16px;margin-bottom:9px}.cat-title{font-size:12px}.cat-desc{font-size:11px}.nav-item{font-size:10px}.sell-circle{width:52px;height:52px}}
</style>
</head>
