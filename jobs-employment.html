<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs & Employment | OGARS Platform</title>
<style>
:root{--purple:#542b91;--purple2:#6722ca;--lavender:#f1e7ff;--lavender2:#e8d8fb;--ink:#19152f;--muted:#777188;--line:#e5dcf0;--white:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--ink)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
.hero{height:210px;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:18px 20px;background:linear-gradient(110deg,#7022d2 0%,#51218f 100%);color:#fff}
.back{flex:0 0 auto;font-size:30px;line-height:1;color:white;padding:0 1px}
.hero-icon{flex:0 0 80px;width:80px;height:80px;border:3px solid #fff;border-radius:22px;display:grid;place-items:center;position:relative;z-index:1}
.hero-icon svg{width:47px;height:47px;stroke:white;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.hero-copy{position:relative;z-index:1;min-width:0}
.hero h1{font-size:27px;line-height:1.03;font-weight:800;margin:0 0 10px;letter-spacing:-.5px}
.hero p{font-size:15px;line-height:1.35;margin:0;color:#f3eaff}
.watermark{position:absolute;right:4%;top:8px;width:145px;height:145px;opacity:.12;stroke:#fff;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
main{max-width:900px;margin:0 auto;padding:18px 19px 112px;background:#fff}
.search-panel{padding:15px 15px 16px;background:var(--lavender);border:1px solid #e7daf8;border-radius:28px;box-shadow:0 8px 18px rgba(62,25,108,.07)}
.search-input{display:block;width:100%;height:59px;padding:0 20px;border:1px solid #e8e2ef;border-radius:21px;background:#fff;color:var(--ink);font-size:15px;outline:none}
.search-input:focus{border-color:#a77bdf}
.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
select{width:100%;min-width:0;height:58px;padding:0 13px;border:1px solid #e7e1ef;border-radius:19px;background:#fff;color:#302a3e;font-size:14px;outline:none}
.search-button{display:block;width:100%;height:59px;margin-top:12px;border:0;border-radius:18px;background:#542b91;color:white;font-size:17px;font-weight:800;cursor:pointer}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:25px 2px 0}
.section-head h2{font-size:21px;line-height:1.18;font-weight:800;margin:0;letter-spacing:-.45px}
.all-jobs{flex:0 0 auto;padding-top:2px;color:#5e2aa2;font-size:15px;line-height:1.25;font-weight:800;white-space:nowrap}
.section-subtitle{font-size:15px;line-height:1.5;color:var(--muted);margin:13px 2px 19px}
.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.category{min-width:0;display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:10px 10px 14px;background:#fff;border:1px solid #e5dcef;border-radius:25px;box-shadow:0 4px 12px rgba(50,26,80,.06);color:var(--ink);cursor:pointer}
.category:focus-visible{outline:2px solid #7a40bd;outline-offset:2px}
.cat-picture{height:122px;width:100%;display:grid;place-items:center;margin-bottom:11px;border-radius:18px;background:linear-gradient(145deg,#f1e5ff,#f8f2ff)}
.cat-picture svg{width:76px;height:76px;stroke:#51258d;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.category:nth-child(3n+2) .cat-picture svg{stroke:#6722bd}
.category:nth-child(3n) .cat-picture svg{stroke:#7541b6}
.cat-title{font-size:14px;line-height:1.25;font-weight:800;margin:0 2px 6px}
.cat-desc{font-size:12px;line-height:1.4;color:var(--muted);margin:0 2px}
.job-listings{margin-top:31px}
.job-listings h2{font-size:21px;margin:0 0 10px}
.status{font-size:13px;line-height:1.5;color:var(--muted);margin:0}
.bottom-nav{position:fixed;z-index:10;left:0;right:0;bottom:0;min-height:78px;padding:7px 5px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid #eee8f4;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav-item{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#777187;font-size:11px}
.nav-item svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:#542b91;font-weight:800}
.nav-sell{height:66px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;color:#777187;font-size:11px}
.sell-circle{width:54px;height:54px;margin-top:-22px;border-radius:50%;background:#6420c1;color:#fff;display:grid;place-items:center;box-shadow:none;border:0;outline:none}
.sell-circle svg{width:29px;height:29px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round}
@media(min-width:620px){.hero{padding-left:max(25px,calc((100vw - 860px)/2));padding-right:max(25px,calc((100vw - 860px)/2))}.watermark{right:calc((100vw - 850px)/2)}main{padding:22px 22px 115px}.cat-picture{height:150px}.cat-picture svg{width:88px;height:88px}.category{padding:12px 12px 16px}.cat-title{font-size:15px}.cat-desc{font-size:13px}}
@media(max-width:380px){.hero{height:190px;padding:15px 10px;gap:8px}.back{font-size:26px}.hero-icon{flex-basis:66px;width:66px;height:66px;border-radius:18px}.hero-icon svg{width:39px;height:39px}.hero h1{font-size:21px}.hero p{font-size:13px}.watermark{width:110px;height:110px;right:1%}main{padding:16px 13px 108px}.search-panel{padding:12px;border-radius:25px}.search-input{height:54px;padding:0 15px;font-size:14px}.filter-row{gap:8px}select{height:55px;padding:0 8px;font-size:12px;border-radius:17px}.search-button{height:56px;font-size:16px}.section-head h2{font-size:19px}.all-jobs{font-size:13px}.section-subtitle{font-size:14px;margin-top:11px;margin-bottom:16px}.category-grid{gap:9px}.category{padding:7px 7px 11px;border-radius:22px}.cat-picture{height:90px;border-radius:16px;margin-bottom:9px}.cat-picture svg{width:60px;height:60px}.cat-title{font-size:12px}.cat-desc{font-size:11px}.nav-item{font-size:10px}.sell-circle{width:52px;height:52px}}
</style>
</head>
<body>
<header class="hero">
<a class="back" href="index.html" aria-label="Back to home">‹</a>
<div class="hero-icon" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="8" y="20" width="48" height="34" rx="5"/><path d="M22 20v-7a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v7M8 31c13 8 35 8 48 0M28 32h8v7h-8z"/></svg></div>
<div class="hero-copy"><h1>OGARS<br>JOBS &amp; EMPLOYMENT</h1><p>Find your next job in Ghana</p></div>
<svg class="watermark" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="20" width="48" height="34" rx="5"/><path d="M22 20v-7a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v7M8 31c13 8 35 8 48 0M28 32h8v7h-8z"/></svg>
</header>
<main>
<section class="search-panel" aria-label="Search and filter jobs">
<input class="search-input" id="jobSearch" type="search" placeholder="Search job title, company or skill..." aria-label="Search job title, company or skill">
<div class="filter-row">
<select id="region" aria-label="Choose region"><option value="">📍 All Ghana</option><option>Greater Accra</option><option>Ashanti</option><option>Western</option><option>Central</option><option>Eastern</option><option>Volta</option><option>Northern</option><option>Upper East</option><option>Upper West</option><option>Bono</option><option>Bono East</option><option>Ahafo</option><option>Western North</option><option>Oti</option><option>Savannah</option><option>North East</option></select>
<select id="employmentType" aria-label="Employment type"><option value="">All Employment Types</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Temporary</option><option>Internship</option><option>Casual/Daily work</option><option>Remote/Work from home</option></select>
</div>
<button class="search-button" id="searchButton">⌕ &nbsp; Search Jobs</button>
</section>
<div class="section-head"><h2>Browse Job Categories</h2><a class="all-jobs" href="#jobListings">All Jobs →</a></div>
<p class="section-subtitle">Find the right job and explore opportunities.</p>
<section class="category-grid" aria-label="Job categories">
<button class="category" data-category="Office & Administration"><span class="cat-picture"><svg viewBox="0 0 64 64"><path d="M12 55h40M17 55V24h30v31M25 24v-8h14v8M23 33h5M36 33h5M23 42h5M36 42h5M29 55V46h7v9"/></svg></span><span class="cat-title">Office &amp; Administration</span><span class="cat-desc">Office and admin roles</span></button>
<button class="category" data-category="Driving & Transport"><span class="cat-picture"><svg viewBox="0 0 64 64"><path d="M10 38l4-14a5 5 0 0 1 5-4h26a5 5 0 0 1 5 4l4 14v11H10zM14 37h36M18 49v5M46 49v5M18 43h5M41 43h5M22 20l3-7h14l3 7"/></svg></span><span class="cat-title">Driving &amp; Transport</span><span class="cat-desc">Drivers and transport</span></button>
<button class="category" data-category="Hospitality & Catering"><span class="cat-picture"><svg viewBox="0 0 64 64"><path d="M13 9v20M7 9v11a6 6 0 0 0 12 0V9M13 29v26M39 9v46M39 9c11 7 13 19 0 23"/></svg></span><span class="cat-title">Hospitality &amp; Catering</span><span class="cat-desc">Hotels, food and service</span></button>
<button class="category" data-category="Sales & Customer Service"><span class="cat-picture"><svg viewBox="0 0 64 64"><path d="M8 27h48L51 14H13zM12 27v27h40V27M8 27h48M20 54V39h12v15M19 19h1M31 19h1M43 19h1"/></svg></span><span class="cat-title">Sales &amp; Customer Service</span><span class="cat-desc">Sales and customer support</span></button>
<button class="category" data-category="Construction & Technical"><span class="cat-picture"><svg viewBox="0 0 64 64"><path d="M13 49l27-27M34 15l6-6 14 14-6 6M10 52l8 3 5-5-8-8zM37 32l-5-5"/></svg></span><span class="cat-title">Construction &amp; Technical</span><span class="cat-desc">Trade and technical roles</span></button>
<button class="category" data-category="Education & Care"><span class="cat-picture"><svg viewBox="0 0 64 64"><path d="M8 22l24-12 24 12-24 12zM17 28v13c9 8 23 8 30 0V28M56 22v17M52 43h8"/></svg></span><span class="cat-title">Education &amp; Care</span><span class="cat-desc">Teaching and care roles</span></button>
<button class="category" data-category="Warehouse & Logistics"><span class="cat-picture"><svg viewBox="0 0 64 64"><path d="M10 25h21v20H10zM33 14h21v20H33zM33 37h21v20H33zM14 30h13M37 19h13M37 42h13M10 49h21"/></svg></span><span class="cat-title">Warehouse &amp; Logistics</span><span class="cat-desc">Stock and delivery work</span></button>
<button class="category" data-category="IT & Creative Work"><span class="cat-picture"><svg viewBox="0 0 64 64"><rect x="8" y="10" width="48" height="34" rx="3"/><path d="M4 52h56M22 44l-3 8M42 44l3 8M25 21l-7 6 7 6M39 21l7 6-7 6M36 20l-7 14"/></svg></span><span class="cat-title">IT &amp; Creative Work</span><span class="cat-desc">Digital and creative jobs</span></button>
<button class="category" data-category=""><span class="cat-picture"><svg viewBox="0 0 64 64"><circle cx="32" cy="18" r="8"/><circle cx="13" cy="25" r="6"/><circle cx="51" cy="25" r="6"/><path d="M16 52V43a16 16 0 0 1 32 0v9zM2 50v-7a11 11 0 0 1 9-11M62 50v-7a11 11 0 0 0-9-11"/></svg></span><span class="cat-title">All Jobs</span><span class="cat-desc">Browse every opportunity</span></button>
</section>
<section class="job-listings" id="jobListings"><h2>Job Vacancies</h2><p class="status" id="status">Job listings will appear here once this page is connected to the correct jobs table in Supabase.</p></section>
</main>
<nav class="bottom-nav" aria-label="Main navigation">
<a class="nav-item active" href="index.html"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V21H3z"/></svg><span>Home</span></a>
<a class="nav-item" href="discover.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>Explore</span></a>
<a class="nav-sell" href="products.html"><span class="sell-circle"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></span><span>Sell</span></a>
<a class="nav-item" href="ai-search.html"><svg viewBox="0 0 24 24"><path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></svg><span>AI Search</span></a>
<a class="nav-item" href="account.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2z"/></svg><span>Account</span></a>
</nav>
<script>
let selectedCategory="";
document.querySelectorAll(".category").forEach(button=>button.addEventListener("click",()=>{selectedCategory=button.dataset.category;document.querySelectorAll(".category").forEach(card=>card.style.borderColor=card===button?"#8a56bd":"#e5dcef");document.getElementById("jobSearch").value=selectedCategory;document.getElementById("jobListings").scrollIntoView({behavior:"smooth"});}));
document.getElementById("searchButton").addEventListener("click",()=>{document.getElementById("jobListings").scrollIntoView({behavior:"smooth"});document.getElementById("status").textContent="Search and filters are ready visually. Connect the actual jobs database to show matching vacancies.";});
</script>
</body>
</html>
