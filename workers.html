<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Find a Worker - OGARS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #0b5ed7;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px 16px;
    }

    .search-box {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    .worker-card {
      background: white;
      margin-bottom: 18px;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .worker-card h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .worker-card p {
      margin: 7px 0;
      color: #555;
    }

    .rating {
      font-weight: bold;
    }

    .available {
      color: green;
      font-weight: bold;
    }

    .button {
      display: block;
      text-align: center;
      background: #0b5ed7;
      color: white;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

  </header>

  <div class="container">

<select id="worker-area">

</select>
    </div>

<div id="worker-list">
</div>

  </div>

workerAreas.forEach(function(area) {
  const option = document.createElement("option");
  option.value = area;
  option.textContent = area;
  workerArea.appendChild(option);
});

async function loadWorkers() {
    const { data, error } = await supabaseClient
  .from("workers")
  .select("id, full_name, location, main_skill, years_experience, about_work")
  .order("created_at", { ascending: false });


    if (error) {
  alert("Supabase error: " + error.message);
  console.error(error);
  return;
}

    const workerList = document.getElementById("worker-list");

    
    data.forEach(worker => {
      const card = document.createElement("div");
      card.className = "worker-card";

      card.innerHTML = `
  <h2>🔧 ${worker.full_name} — ${worker.main_skill}</h2>
  <p>📍 ${worker.location}</p>
  <p>💼 ${worker.years_experience} years experience</p>
  <p class="available">✅ Available for work</p>
  <p>${worker.about_work || ""}</p>
<a href="worker-profile.html?id=${worker.id}" class="button">View Profile</a>
`;

      workerList.appendChild(card);
    });
  }

  loadWorkers();

function filterWorkers() {
  const search = document.getElementById("worker-search").value.toLowerCase().trim();
  const selectedArea = document.getElementById("worker-area").value.toLowerCase().trim();
  const cards = document.querySelectorAll(".worker-card");

  cards.forEach(card => {
    const cardText = card.textContent.toLowerCase();

    const matchesSearch = cardText.includes(search);
    const matchesArea = !selectedArea || cardText.includes(selectedArea);

    card.style.display =
      matchesSearch && matchesArea
        ? "block"
        : "none";
  });
}

document.getElementById("worker-search").addEventListener("input", filterWorkers);

document.getElementById("worker-area").addEventListener("change", filterWorkers);
