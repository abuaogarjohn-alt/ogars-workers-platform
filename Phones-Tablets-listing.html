ar(--s);display:flex;gap:11px;align-items:center;min-height:90px}.tile .emoji{width:44px;height:44px;border-radius:13px;background:var(--l);display:grid;place-items:center;font-size:23px;flex-shrink:0}.tile strong{display:block;font-size:14px}.tile small{display:block;color:var(--m);font-size:12px;margin-top:3px}.section-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:24px 0 12px}.section-title h3{margin:0;font-size:19px}.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 10px;margin-bottom:8px}.chip{white-space:nowrap;border:1px solid var(--b);border-radius:999px;padding:9px 12px;background:#fff;color:var(--p);font-size:13px;font-weight:700;cursor:pointer}.chip.active{background:var(--p);color:#fff}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--b);border-radius:16px;overflow:hidden;box-shadow:var(--s)}.photo{height:165px;background:#f5f1fb;display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:40px;color:#8b72b5}.info{padding:12px}.price{color:var(--p);font-weight:800;font-size:17px;margin:0 0 5px}.title{font-size:14px;line-height:1.35;margin:0 0 7px;overflow-wrap:anywhere}.meta{color:var(--m);font-size:12px;margin:0 0 10px}.contact-row{display:flex;gap:7px}.contact-row a{flex:1;text-align:center;padding:9px 5px;border-radius:10px;background:var(--l);color:var(--p);font-weight:700;font-size:12px}.state{background:#fff;border:1px dashed var(--b);border-radius:16px;padding:24px;text-align:center;color:var(--m);grid-column:1/-1}.footer{text-align:center;color:var(--m);font-size:12px;padding:25px 8px}@media(min-width:700px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.photo{height:190px}}@media(max-width:360px){.cards{grid-template-columns:1fr}.photo{height:200px}.search{flex-wrap:wrap}.search .btn{width:100%}}</style></head><body><header><a class="back" href="index.html" aria-label="Back to homepage">‹</a><div class="brand-icon">⌂</div><div class="brand-copy"><h1>OGARS PLATFORM</h1><p>Phones, tablets & accessories</p></div></header><main><section class="hero"><div class="eyebrow">Browse marketplace</div><h2 id="page-title">Phones & Tablets</h2><p class="muted">Explore available adverts. Use search to narrow the results.</p><div class="search"><input id="search" placeholder="Search brand, model or item…" aria-label="Search adverts"><button class="btn" id="search-btn">Search</button></div><a class="btn secondary" href="advertise.html" style="display:inline-block">＋ Post an advert</a></section><div class="filters" id="filters"></div><div class="section-title"><h3>Available adverts</h3><span id="count" class="muted">Loading…</span></div><div class="cards" id="results"><div class="state">Loading adverts…</div></div><div class="footer">© <span id="year"></span> OGARS Platform</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUB_URL="https://pawqsmcswoypuiihfbrr.supabase.co",SUB_KEY="sb_publishable_skeGOdL2kqtHNQwXJjmSSg_exGApfnb",db=supabase.createClient(SUB_URL,SUB_KEY);const categories=['All items','Mobile phones','Tablets & iPads','Phone accessories','Tablet accessories','Smartwatches','Headphones & earbuds','Phone parts & repairs','Other phone gadgets'];const params=new URLSearchParams(location.search);let selected=params.get('subcategory')||'All items',all=[];document.getElementById('page-title').textContent=selected==='All items'?'Phones & Tablets':selected;document.getElementById('search').value=params.get('search')||'';const filters=document.getElementById('filters');filters.innerHTML=categories.map(c=>`<button class="chip ${c.toLowerCase()===selected.toLowerCase()?'active':''}" data-cat="${c}">${c}</button>`).join('');filters.addEventListener('click',e=>{let b=e.target.closest('[data-cat]');if(!b)return;selected=b.dataset.cat;document.getElementById('page-title').textContent=selected==='All items'?'Phones & Tablets':selected;filters.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.cat===selected));render()});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function money(v){if(v===null||v===undefined||v==='')return 'Contact for price';const n=Number(String(v).replace(/[^0-9.-]/g,''));return Number.isFinite(n)?'GH₵ '+n.toLocaleString('en-GH'):esc(v)}function isPhone(a){let t=(String(a.title||'')+' '+String(a.description||'')).toLowerCase();return String(a.listing_type||'').toLowerCase()==='products & goods'&&/(phone|tablet|ipad|iphone|samsung|tecno|infinix|xiaomi|oppo|smartwatch|earbud|headphone|charger|power bank|mobile|screen repair|phone repair|accessor)/i.test(t)}function matchSub(a){if(selected==='All items')return true;let t=(String(a.title||'')+' '+String(a.description||'')).toLowerCase();const terms={'Mobile phones':['phone','iphone','samsung galaxy','tecno','infinix','xiaomi','oppo','mobile'],'Tablets & iPads':['tablet','ipad','samsung tab'],'Phone accessories':['phone case','charger','cable','power bank','phone accessory','screen protector'],'Tablet accessories':['tablet cover','tablet keyboard','stylus'],'Smartwatches':['smartwatch','smart watch','fitness watch'],'Headphones & earbuds':['headphone','earbud','earphone','airpods'],'Phone parts & repairs':['screen repair','phone repair','phone parts','phone screen','battery replacement'],'Other phone gadgets':['mobile gadget']};return (terms[selected]||[]).some(x=>t.includes(x))}function card(a){let im=String(a.photo_urls||'').split(',')[0].trim(),ph=String(a.phone||a.whatsapp||'').replace(/[^+\d]/g,'');return `<article class="card"><div class="photo">${im?`<img src="${esc(im)}" alt="${esc(a.title||'Phone or tablet')}" loading="lazy" onerror="this.style.display='none'">`:'<div class="placeholder">📱</div>'}</div><div class="info"><p class="price">${money(a.price)}</p><h3 class="title">${esc(a.title||'Phone or tablet advert')}</h3><p class="meta">⌖ ${esc(a.location||'Ghana')} ${a.created_at?' · '+new Date(a.created_at).toLocaleDateString('en-GB'):''}</p><p class="meta">${esc(String(a.description||'').slice(0,120))}</p><div class="contact-row">${ph?`<a href="tel:${esc(ph)}">Call seller</a>`:''}${a.whatsapp?`<a href="https://wa.me/${esc(String(a.whatsapp).replace(/\D/g,''))}" target="_blank" rel="noopener">WhatsApp</a>`:''}</div></div></article>`}function render(){let q=document.getElementById('search').value.trim().toLowerCase();let rows=all.filter(a=>isPhone(a)&&matchSub(a));if(q)rows=rows.filter(a=>(String(a.title||'')+' '+String(a.description||'')+' '+String(a.location||'')).toLowerCase().includes(q));document.getElementById('count').textContent=rows.length+' advert'+(rows.length===1?'':'s');document.getElementById('results').innerHTML=rows.length?rows.map(card).join(''):'<div class="state"><strong>No matching adverts found yet.</strong><br>Try another search or choose a different ca
