<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#512A91">
<title>OGARS Properties | Browse Listings</title>
<style>
:root{--p:#512A91;--pd:#3e1d78;--l:#f1eaff;--n:#171638;--m:#706b8c;--b:#e5dcf7;--s:0 5px 16px rgba(70,39,130,.09)}
*{box-sizing:border-box}body{margin:0;background:#faf9fd;color:var(--n);font-family:Arial,Helvetica,sans-serif;line-height:1.45}a{color:inherit;text-decoration:none}
header{background:linear-gradient(115deg,#6d28d9,#512A91 56%,#38166f);color:white;padding:20px;display:flex;align-items:center;gap:13px;box-shadow:0 3px 12px #28144a20}
.back{font-size:30px;width:25px;color:white}.brand-icon{width:48px;height:48px;border:2px solid #ffffffd9;border-radius:13px;display:grid;place-items:center;font-size:30px;flex-shrink:0}.brand-copy h1{font-size:clamp(22px,5vw,30px);line-height:1.05;margin:0;font-weight:800}.brand-copy p{margin:6px 0 0;color:#f0e8ff;font-size:14px}
main{width:min(100%,1000px);margin:auto;padding:18px 15px 40px}.search-panel{background:var(--l);border:1px solid #e8ddff;border-radius:21px;padding:14px;box-shadow:var(--s);margin-bottom:22px}.search-panel h2{font-size:20px;margin:0 0 11px}
input,select{width:100%;min-height:49px;border:1px solid var(--b);border-radius:12px;background:white;padding:12px;color:var(--n);font-size:15px;outline:none}input:focus,select:focus{border-color:var(--p);box-shadow:0 0 0 3px #512a9118}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:9px}.filters.two{grid-template-columns:1fr 1fr}.search-button{width:100%;min-height:49px;margin-top:10px;border:0;border-radius:12px;background:var(--p);color:white;font-weight:700;font-size:16px;cursor:pointer}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 1px 15px}.top-row h2{margin:0;font-size:clamp(21px,4.8vw,27px);line-height:1.2}.top-row p{margin:5px 0 0;color:var(--m);font-size:14px}.link{color:#6124c9;font-weight:700;white-space:nowrap}.count{color:var(--m);font-size:13px;margin:0 0 12px}
.listing-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:white;border:1px solid var(--b);border-radius:17px;overflow:hidden;box-shadow:var(--s);min-width:0}.photo{position:relative;background:#eee6fc;aspect-ratio:4/3;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{width:100%;height:100%;display:grid;place-items:center;color:var(--p);font-size:48px;background:linear-gradient(135deg,#eee4ff,#fff)}.info{padding:12px}.price{color:var(--p);font-weight:800;font-size:18px;margin:0 0 5px;overflow-wrap:anywhere}.title{font-size:15px;font-weight:700;line-height:1.3;margin:0 0 7px;overflow-wrap:anywhere}.location{font-size:13px;color:var(--m);margin:0 0 8px}.meta{font-size:12px;color:#595473;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}.actions{display:grid;grid-template-columns:1fr;gap:7px}.details,.contact{display:block;text-align:center;border-radius:9px;padding:10px 8px;font-size:13px;font-weight:700}.details{background:var(--l);color:var(--p)}.contact{background:var(--p);color:white}.state{padding:24px 16px;text-align:center;background:#fff;border:1px dashed #cbb7ef;border-radius:15px;color:var(--m);grid-column:1/-1}.state strong{display:block;color:var(--p);margin-bottom:5px}.state a{display:inline-block;margin-top:12px;background:var(--p);color:#fff;padding:10px 15px;border-radius:9px;font-weight:700}.footer{text-align:center;color:var(--m);font-size:12px;padding:25px 10px}
@media(min-width:720px){main{padding:26px 20px 45px}.listing-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.info{padding:15px}.actions{grid-template-columns:1fr 1fr}}
@media(max-width:390px){main{padding-left:10px;padding-right:10px}.filters{grid-template-columns:1fr 1fr}.filters select:last-child{grid-column:1/-1}.listing-grid{gap:8px}.info{padding:9px}.price{font-size:16px}.title{font-size:14px}}
</style>
</head>
<body>
<header><a class="back" href="find-property.html" aria-label="Back to categories">‹</a><div class="brand-icon" aria-hidden="true">⌂</div><div class="brand-copy"><h1>OGARS<br>PROPERTIES</h1><p>Find your next property in Ghana</p></div></header>
<main>
<form class="search-panel" id="filters-form"><h2>Find a property</h2>
<input id="search-query" type="search" placeholder="Search by title, property type or location..." aria-label="Search properties">
<div class="filters">
<select id="category-filter" aria-label="Property category"><option value="">All categories</option><option value="house-for-rent">Houses for Rent</option><option value="apartment-for-rent">Apartments for Rent</option><option value="room-for-rent">Rooms for Rent</option><option value="house-for-sale">Houses for Sale</option><option value="land-for-sale">Land for Sale</option><option value="commercial-property">Commercial Property</option><option value="short-stay">Short Stay / Guest House</option></select>
<select id="region-filter" aria-label="Location"><option value="">All Ghana</option><option>Greater Accra</option><option>Ashanti</option><option>Central</option><option>Eastern</option><option>Western</option><option>Northern</option><option>Volta</option><option>Bono</option><option>Other region</option></select>
<select id="listing-filter" aria-label="Listing purpose"><option value="">Rent and sale</option><option value="Rent">For Rent</option><option value="Sale">For Sale</option></select></div>
<div class="filters two"><select id="price-filter" aria-label="Maximum price"><option value="">Any price</option><option value="1000">Up to GH₵1,000</option><option value="3000">Up to GH₵3,000</option><option value="7000">Up to GH₵7,000</option><option value="15000">Up to GH₵15,000</option></select><select id="sort-filter" aria-label="Sort listings"><option value="newest">Newest first</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option></select></div>
<button class="search-button" type="submit">⌕ &nbsp; Search Properties</button></form>
<section><div class="top-row"><div><h2 id="page-heading">Available Properties</h2><p id="page-subtitle">Explore property adverts from across Ghana.</p></div><a class="link" href="find-property.html">Categories</a></div><p class="count" id="result-count">Loading properties…</p><div class="listing-grid" id="property-list"><div class="state"><strong>Loading properties…</strong>Please wait while we retrieve the latest listings.</div></div></section>
<div class="footer">© 2026 OGARS Platform · Properties &amp; Rentals</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://pawqsmcswoypuiihfbrr.supabase.co";
const SUPABASE_KEY="sb_publishable_skeGOdL2kqtHNQwXJjmSSg_exGApfnb";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const configs={
"house-for-rent":{title:"Houses for Rent",types:["House"],listing:"Rent"},
"apartment-for-rent":{title:"Apartments for Rent",types:["Apartment"],listing:"Rent"},
"room-for-rent":{title:"Rooms for Rent",types:["Room","Student Housing"],listing:"Rent"},
"house-for-sale":{title:"Houses for Sale",types:["House"],listing:"Sale"},
"land-for-sale":{title:"Land for Sale",types:["Land"],listing:"Sale"},
"commercial-property":{title:"Commercial Property",types:["Shop","Office","Warehouse","Commercial Space"]},
"short-stay":{title:"Short Stay / Guest House",types:["Short Stay","Hotel"]}
};
const params=new URLSearchParams(location.search);
const $=id=>document.getElementById(id);
const search=$("search-query"),category=$("category-filter"),region=$("region-filter"),purpose=$("listing-filter"),price=$("price-filter"),sort=$("sort-filter"),list=$("property-list");
let properties=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(p){if(p.price===null||p.price===undefined||p.price==="")return"Contact owner";let n=Number(p.price);return Number.isFinite(n)?"GH₵ "+n.toLocaleString("en-GH"):"Contact owner";}
function matchCategory(p,key){if(!key)return true;let c=configs[key];if(!c)return true;let t=String(p.property_type||"").toLowerCase(),l=String(p.listing_type||"").toLowerCase();return c.types.some(x=>x.toLowerCase()===t)&&(!c.listing||c.listing.toLowerCase()===l);}
function draw(p){let photos=String(p.photo_url||"").split(",").map(x=>x.trim()).filter(Boolean),title=esc(p.title||"Property listing"),loc=esc(p.location||"Location not specified"),type=esc(p.property_type||"Property"),purposeText=esc(p.listing_type||""),ph=String(p.contact_phone||"").replace(/[^+\d]/g,""),image=photos.length?`<img src="${esc(photos[0])}" alt="${title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;placeholder&quot;>⌂</div>'">`:`<div class="placeholder" aria-label="No property photo">⌂</div>`;
return `<article class="card"><div class="photo">${image}</div><div class="info"><p class="price">${esc(money(p))}</p><h3 class="title">${title}</h3><p class="location">⌖ ${loc}</p><div class="meta"><span>${type}</span>${purposeText?`<span>• ${purposeText}</span>`:""}${p.bedrooms!==null&&p.bedrooms!==undefined?`<span>• ${esc(p.bedrooms)} bed</span>`:""}</div><div class="actions"><a class="details" href="property-details.html?id=${encodeURIComponent(p.id)}">View details</a>${ph?`<a class="contact" href="tel:${ph}">Contact</a>`:`<a class="contact" href="property-details.html?id=${encodeURIComponent(p.id)}">Contact</a>`}</div></div></article>`;}
function apply(){let q=search.value.trim().toLowerCase(),key=category.value,loc=region.value.trim().toLowerCase(),pur=purpose.value.toLowerCase(),max=price.value?Number(price.value):null;let rows=properties.filter(p=>{let txt=[p.title,p.location,p.property_type,p.description,p.facilities].join(" ").toLowerCase();if(q&&!txt.includes(q))return false;if(!matchCategory(p,key))return false;if(loc&&!String(p.location||"").toLowerCase().includes(loc))return false;if(pur&&String(p.listing_type||"").toLowerCase()!==pur.toLowerCase())return false;if(max!==null&&(p.price===null||p.price===undefined||Number(p.price)>max))return false;return true;});
if(sort.value==="price-low")rows.sort((a,b)=>(a.price==null?Infinity:Number(a.price))-(b.price==null?Infinity:Number(b.price)));else if(sort.value==="price-high")rows.sort((a,b)=>(b.price==null?-Infinity:Number(b.price))-(a.price==null?-Infinity:Number(a.price)));else rows.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
$("result-count").textContent=`${rows.length} ${rows.length===1?"property":"properties"} found`;
if(!rows.length){list.innerHTML=`<div class="state"><strong>No properties found</strong>Try another category, location or price range, or check back later.<br><a href="advertise.html">Post a property</a></div>`;return;}list.innerHTML=rows.map(draw).join("");}

async function load() {
  $("result-count").textContent = "Checking Supabase connection…";

  const { data, error, status } = await db
  .from("properties")
  .select("id,title,available,created_at")
  .order("created_at", { ascending: false });
  if (error) {
    console.error("Supabase error:", error);

    $("result-count").textContent =
      "Supabase error (HTTP " + status + ")";

    list.innerHTML = `
      <div class="state">
        <strong>Could not load property adverts</strong>
        ${esc(error.message)}
        <br>Please send me a screenshot of this message.
      </div>`;

    return;
  }

  properties = data || [];

  console.log("Supabase status:", status);
  console.log("Properties returned:", properties.length);
  console.log("Property data:", properties);

  if (properties.length === 0) {
    $("result-count").textContent =
      "Supabase returned 0 available properties.";

    list.innerHTML = `
      <div class="state">
        <strong>No records received from Supabase</strong>
        The database query returned no available properties.
        Please send me a screenshot of this message.
      </div>`;

    return;
  }

  apply();
}
let initial=params.get("category")||"";if(configs[initial])category.value=initial;if(params.get("q"))search.value=params.get("q");if(params.get("region"))region.value=params.get("region");if(params.get("purpose"))purpose.value=params.get("purpose");
if(initial&&configs[initial]){$("page-heading").textContent=configs[initial].title;$("page-subtitle").textContent="Browse available listings in this category.";if(configs[initial].listing)purpose.value=configs[initial].listing;}
if(params.get("price")){let last=Number(params.get("price").split("-").pop());if(Number.isFinite(last))price.value=String(last);}
$("filters-form").addEventListener("submit",e=>{e.preventDefault();apply();});
[search,category,region,purpose,price,sort].forEach(el=>el.addEventListener(el===search?"input":"change",apply));
load();
</script>
</body></html>
