<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OGARS - Properties & Rentals</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #0b5ed7;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .section {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      color: #0b5ed7;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .button {
      width: 100%;
      margin-top: 20px;
      background: #0b5ed7;
      color: white;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    .property-card {
  background: white;
  padding: 20px;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.property-gallery {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  margin-bottom: 15px;
}

.property-gallery img {
  width: 240px;
  height: 180px;
  object-fit: cover;
  border-radius: 10px;
  flex-shrink: 0;
}
    .property-card h3 {
      color: #0b5ed7;
      margin-top: 0;
    }

    .contact {
      display: inline-block;
      margin-top: 10px;
      background: #0b5ed7;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>OGARS</h1>
  <p>Properties & Rentals</p>
</header>

<main>

  <div class="section">
    <h2>🏠 Post a Property</h2>

<label for="listing-type">What are you offering?</label>
<select id="listing-type">
  <option value="">Select</option>
  <option value="Rent">For Rent</option>
  <option value="Sale">For Sale</option>
</select>
    <label for="property-type">Property Type</label>
    <select id="property-type">
      <option value="">Select property type</option>
      <option value="House">House</option>
      <option value="Apartment">Apartment / Flat</option>
      <option value="Room">Room</option>
      <option value="Student Housing">Student Housing</option>
      <option value="Hotel">Hotel</option>
      <option value="Short Stay">Short Stay</option>
      <option value="Shop">Shop</option>
      <option value="Office">Office</option>
      <option value="Warehouse">Warehouse</option>
      <option value="Commercial Space">Commercial Space</option>
      <option value="Land">Land</option>
      <option value="Other">Other</option>
    </select>

    <label for="title">Listing Title</label>
    <input type="text" id="title" placeholder="e.g. 2 Bedroom Apartment for Rent">

    <label for="location">Location / Community</label>
    <input type="text" id="location" placeholder="e.g. East Legon">

    <label for="price">Price</label>
    <input type="number" id="price" placeholder="e.g. 2500">

    <label for="price-period">Price Period</label>
    <select id="price-period">
      <option value="">Select</option>
      <option value="Per Night">Per Night</option>
      <option value="Per Month">Per Month</option>
      <option value="Per Year">Per Year</option>
      <option value="Total Price">Total Price</option>
    </select>

    <label for="bedrooms">Bedrooms</label>
    <input type="number" id="bedrooms" min="0" placeholder="e.g. 2">

    <label for="bathrooms">Bathrooms</label>
    <input type="number" id="bathrooms" min="0" placeholder="e.g. 2">

    <label for="description">Description</label>
    <textarea id="description" placeholder="Describe the property."></textarea>

    
  <!-- LAND -->
  <div id="land-details" style="display:none;">

    <label for="land-size">Land Size</label>
    <input type="text" id="land-size" placeholder="e.g. 70 x 100 feet">

    <label for="documentation">Documentation</label>
    <input type="text" id="documentation" placeholder="e.g. Site plan, indenture">

    <label for="road-access">Road Access</label>
    <input type="text" id="road-access" placeholder="e.g. Accessible by paved road">

    <label for="land-use">Intended Use</label>
    <input type="text" id="land-use" placeholder="e.g. Residential, commercial, farming">

  </div>

</div>

<label>✨ Facilities / Features</label>

<div id="facilities-list">

  <label>
    <input type="checkbox" value="Wi-Fi">
    Wi-Fi
  </label>

  <label>
    <input type="checkbox" value="Air Conditioning">
    Air Conditioning
  </label>

  <label>
    <input type="checkbox" value="Swimming Pool">
    Swimming Pool
  </label>

  <label>
    <input type="checkbox" value="Parking">
    Parking
  </label>

  <label>
    <input type="checkbox" value="Security">
    Security
  </label>

  <label>
    <input type="checkbox" value="Water">
    Water
  </label>

  <label>
    <input type="checkbox" value="Electricity">
    Electricity
  </label>

  <label>
    <input type="checkbox" value="Kitchen">
    Kitchen
  </label>

  <label>
    <input type="checkbox" value="TV">
    TV
  </label>

  <label>
    <input type="checkbox" value="Generator">
    Generator
  </label>

  <label>
    <input type="checkbox" value="Breakfast">
    Breakfast
  </label>

  <label>
    <input type="checkbox" value="24-hour Reception">
    24-hour Reception
  </label>

</div>
</div>

<label for="property-photo">Property Photos</label>
<input
  type="file"
  id="property-photo"
  accept="image/*"
  multiple
>
<small>Select one or more photos from your phone.</small>

<label for="contact-name">Contact Name</label>
<input type="text" id="contact-name" placeholder="Your name">

    <label for="contact-phone">Contact Phone</label>
    <input type="tel" id="contact-phone" placeholder="e.g. 0241234567">

    <button class="button" type="button" onclick="postProperty()">
      Post Property
    </button>
  </div>

<div class="section">
  <h2>🔎 Find a Property</h2>

  <input
    type="text"
    id="property-search"
    placeholder="Search by location or property name"
  >

  <select id="property-type-filter">
    <option value="">All Property Types</option>
    <option value="House">House</option>
    <option value="Apartment">Apartment / Flat</option>
    <option value="Room">Room</option>
    <option value="Student Housing">Student Housing</option>
    <option value="Hotel">Hotel</option>
    <option value="Short Stay">Short Stay</option>
    <option value="Shop">Shop</option>
    <option value="Office">Office</option>
    <option value="Warehouse">Warehouse</option>
    <option value="Commercial Space">Commercial Space</option>
    <option value="Land">Land</option>
    <option value="Other">Other</option>
  </select>

  <select id="listing-type-filter">
    <option value="">All Listing Types</option>
    <option value="Rent">For Rent</option>
    <option value="Short Stay">Short Stay</option>
    <option value="Hotel">Hotel</option>
    <option value="Sale">For Sale</option>
  </select>

  <div id="property-list">
    Loading properties...
  </div>
</div>

</main>

<footer>
  © 2026 OGARS Workers Platform
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL = "https://pawqsmcswoypuiihfbrr.supabase.co";

  const SUPABASE_KEY = "sb_publishable_skeGOdL2kqtHNQwXJjmSSg_exGApfnb";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

async function postProperty() {

  const listingType = document.getElementById("listing-type").value;
  const propertyType = document.getElementById("property-type").value;
  const title = document.getElementById("title").value.trim();
  const location = document.getElementById("location").value.trim();
  const price = document.getElementById("price").value;
  const pricePeriod = document.getElementById("price-period").value;
  const bedrooms = document.getElementById("bedrooms").value;
  const bathrooms = document.getElementById("bathrooms").value;
  const description = document.getElementById("description").value.trim();

  const contactName = document.getElementById("contact-name").value.trim();
  const contactPhone = document.getElementById("contact-phone").value.trim();
  const photoFiles = document.getElementById("property-photo").files;

  if (
    !listingType ||
    !propertyType ||
    !title ||
    !location ||
    !contactName ||
    !contactPhone
  ) {
    alert("Please complete the listing type, property type, title, location and contact details.");
    return;
  }

  /* COLLECT CHECKED FACILITIES */

  const selectedFacilities = [];

  document
    .querySelectorAll("#facilities-list input[type='checkbox']:checked")
    .forEach(function(checkbox) {
      selectedFacilities.push(checkbox.value);
    });

  const facilities = selectedFacilities.join(", ");

  /* PROPERTY-SPECIFIC DETAILS */

  let furnished = null;
  let landSize = null;
  let documentation = null;
  let roadAccess = null;
  let roomType = null;
  let distanceToSchool = null;
  let floorSize = null;
  let businessUse = null;

  if (propertyType === "House" || propertyType === "Apartment") {

    const furnishedField = document.getElementById("furnished");

    if (furnishedField) {
      furnished = furnishedField.value;
    }
  }

  if (propertyType === "Room" || propertyType === "Student Housing") {

    const roomTypeField = document.getElementById("room-type");
    const distanceField = document.getElementById("distance-to-school");

    if (roomTypeField) {
      roomType = roomTypeField.value.trim();
    }

    if (distanceField) {
      distanceToSchool = distanceField.value.trim();
    }
  }

  if (
    propertyType === "Shop" ||
    propertyType === "Office" ||
    propertyType === "Warehouse" ||
    propertyType === "Commercial Space"
  ) {

    const floorSizeField = document.getElementById("floor-size");
    const businessUseField = document.getElementById("business-use");

    if (floorSizeField) {
      floorSize = floorSizeField.value.trim();
    }

    if (businessUseField) {
      businessUse = businessUseField.value.trim();
    }
  }

  if (propertyType === "Land") {

    const landSizeField = document.getElementById("land-size");
    const documentationField = document.getElementById("documentation");
    const roadAccessField = document.getElementById("road-access");

    if (landSizeField) {
      landSize = landSizeField.value.trim();
    }

    if (documentationField) {
      documentation = documentationField.value.trim();
    }

    if (roadAccessField) {
      roadAccess = roadAccessField.value.trim();
    }
  }

  /* UPLOAD PHOTOS */

  let photoUrls = [];

  for (const file of photoFiles) {

    const fileName =
      Date.now() +
      "-" +
      Math.random().toString(36).substring(2, 8) +
      "-" +
      file.name.replace(/[^a-zA-Z0-9.-]/g, "-");

    const { error: uploadError } = await supabaseClient
      .storage
      .from("property-photos")
      .upload(fileName, file);

    if (uploadError) {
      alert("Photo upload error: " + uploadError.message);
      console.error(uploadError);
      return;
    }

    const { data: urlData } = supabaseClient
      .storage
      .from("property-photos")
      .getPublicUrl(fileName);

    photoUrls.push(urlData.publicUrl);
  }

  /* CREATE PROPERTY */

  const property = {

    listing_type: listingType,
    property_type: propertyType,
    title: title,
    location: location,

    price: price ? Number(price) : null,
    price_period: pricePeriod,

    bedrooms: bedrooms ? Number(bedrooms) : null,
    bathrooms: bathrooms ? Number(bathrooms) : null,

    description: description,
    facilities: facilities,

    furnished: furnished,
    land_size: landSize,
    documentation: documentation,
    road_access: roadAccess,
    room_type: roomType,
    distance_to_school: distanceToSchool,
    floor_size: floorSize,
    business_use: businessUse,

    photo_url: photoUrls.length > 0
      ? photoUrls.join(",")
      : null,

    contact_name: contactName,
    contact_phone: contactPhone
  };

  const { error } = await supabaseClient
    .from("properties")
    .insert([property]);

  if (error) {
    alert("Error: " + error.message);
    console.error(error);
    return;
  }

  alert("Property posted successfully!");

  document.getElementById("property-photo").value = "";

  loadProperties();
}

async function loadProperties() {

    const { data, error } = await supabaseClient
      .from("properties")
      .select("*")
      .eq("available", true)
      .order("created_at", { ascending: false });

    const list = document.getElementById("property-list");

    if (error) {
      list.innerHTML = "Unable to load properties.";
      console.error(error);
      return;
    }

    if (!data || data.length === 0) {
      list.innerHTML = "No properties posted yet.";
      return;
    }

    list.innerHTML = "";

    data.forEach(property => {

      const card = document.createElement("div");
      card.className = "property-card";

card.innerHTML = `
  ${property.photo_url ? `
    <div class="property-gallery">
      ${property.photo_url.split(",").map(photo => `
        <img
          src="${photo}"
          alt="${property.title}"
        >
      `).join("")}
    </div>
  ` : ""}

  <h3>🏠 ${property.title}</h3>

  <p>📍 <strong>Location:</strong> ${property.location}</p>
  <p>🏷️ <strong>Type:</strong> ${property.property_type}</p>
  <p>📌 <strong>Listing:</strong> ${property.listing_type}</p>

  <p>💰 <strong>Price:</strong>
    ${property.price ? property.price : "Contact owner"}
    ${property.price_period || ""}
  </p>

  <p>🛏️ <strong>Bedrooms:</strong>
    ${property.bedrooms ?? "N/A"}
  </p>

  <p>🚿 <strong>Bathrooms:</strong>
    ${property.bathrooms ?? "N/A"}
  </p>

  ${property.furnished ? `<p>🛋️ <strong>Furnished:</strong> ${property.furnished}</p>` : ""}
  ${property.parking ? `<p>🚗 <strong>Parking:</strong> ${property.parking}</p>` : ""}
  ${property.water ? `<p>💧 <strong>Water:</strong> ${property.water}</p>` : ""}
  ${property.electricity ? `<p>⚡ <strong>Electricity:</strong> ${property.electricity}</p>` : ""}
  ${property.security ? `<p>🔐 <strong>Security:</strong> ${property.security}</p>` : ""}

  ${property.room_type ? `<p>🛏️ <strong>Room Type:</strong> ${property.room_type}</p>` : ""}
  ${property.distance_to_school ? `<p>🎓 <strong>Distance to School:</strong> ${property.distance_to_school}</p>` : ""}

  ${property.wifi ? `<p>📶 <strong>Wi-Fi:</strong> ${property.wifi}</p>` : ""}
  ${property.air_conditioning ? `<p>❄️ <strong>Air Conditioning:</strong> ${property.air_conditioning}</p>` : ""}
  ${property.swimming_pool ? `<p>🏊 <strong>Swimming Pool:</strong> ${property.swimming_pool}</p>` : ""}

  ${property.land_size ? `<p>🌍 <strong>Land Size:</strong> ${property.land_size}</p>` : ""}
  ${property.documentation ? `<p>📄 <strong>Documentation:</strong> ${property.documentation}</p>` : ""}
  ${property.road_access ? `<p>🛣️ <strong>Road Access:</strong> ${property.road_access}</p>` : ""}

  ${property.floor_size ? `<p>📐 <strong>Floor Size:</strong> ${property.floor_size}</p>` : ""}
  ${property.business_use ? `<p>🏪 <strong>Suitable Business Use:</strong> ${property.business_use}</p>` : ""}

  <p>${property.description || ""}</p>

  <p>
    <strong>✨ Facilities:</strong>
    ${property.facilities || "Not specified"}
  </p>

  <a class="contact" href="tel:${property.contact_phone}">
    📞 Contact
  </a>
`;

      list.appendChild(card);
    });
  }

  loadProperties();

document.getElementById("property-search")
  .addEventListener("input", filterProperties);

document.getElementById("property-type-filter")
  .addEventListener("change", filterProperties);

document.getElementById("listing-type-filter")
  .addEventListener("change", filterProperties);

function filterProperties() {

  const search = document
    .getElementById("property-search")
    .value
    .toLowerCase()
    .trim();

  const propertyType = document
    .getElementById("property-type-filter")
    .value
    .toLowerCase();

  const listingType = document
    .getElementById("listing-type-filter")
    .value
    .toLowerCase();

  const cards = document.querySelectorAll(".property-card");

  cards.forEach(card => {

    const text = card.textContent.toLowerCase();

    const matchesSearch =
      !search || text.includes(search);

    const matchesPropertyType =
      !propertyType || text.includes(propertyType);

    const matchesListingType =
      !listingType || text.includes(listingType);

    card.style.display =
      matchesSearch &&
      matchesPropertyType &&
      matchesListingType
        ? "block"
        : "none";
  });
}
const propertyTypeSelect = document.getElementById("property-type");

propertyTypeSelect.addEventListener("change", function () {

  const type = this.value;

  document.getElementById("residential-details").style.display = "none";
  document.getElementById("room-details").style.display = "none";
  document.getElementById("hotel-details").style.display = "none";
  document.getElementById("short-stay-details").style.display = "none";
  document.getElementById("commercial-details").style.display = "none";
  document.getElementById("land-details").style.display = "none";

  if (type === "House" || type === "Apartment") {
    document.getElementById("residential-details").style.display = "block";
  }

  else if (type === "Room" || type === "Student Housing") {
    document.getElementById("room-details").style.display = "block";
  }

  else if (type === "Hotel") {
    document.getElementById("hotel-details").style.display = "block";
  }

  else if (type === "Short Stay") {
    document.getElementById("short-stay-details").style.display = "block";
  }

  else if (
    type === "Shop" ||
    type === "Office" ||
    type === "Warehouse" ||
    type === "Commercial Space"
  ) {
    document.getElementById("commercial-details").style.display = "block";
  }

  else if (type === "Land") {
    document.getElementById("land-details").style.display = "block";
  }

});
</script>

</body>
</html>
