<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#512A91"><title>Phone &amp; Tablet Details | OGARS Platform</title><style>
:root{--p:#512A91;--l:#f1eaff;--n:#171638;--m:#706b8c;--b:#e5dcf7;--s:0 5px 18px rgba(70,39,130,.1)}*{box-sizing:border-box}body{margin:0;background:#faf9fd;color:var(--n);font-family:Arial,Helvetica,sans-serif;line-height:1.5}a{text-decoration:none;color:inherit}.brand{min-height:110px;padding:18px;display:flex;align-items:center;gap:12px;color:#fff;background:linear-gradient(115deg,#6d28d9,#512A91 58%,#38166f)}.back{font-size:30px}.brand-icon{font-size:30px;border:2px solid white;border-radius:13px;width:48px;height:48px;display:grid;place-items:center}.brand h1{font-size:clamp(20px,5vw,28px);margin:0;line-height:1.1}.brand p{margin:5px 0 0;color:#f0e8ff;font-size:13px}main{max-width:900px;margin:auto;padding:18px 14px 50px}.panel{background:#fff;border:1px solid var(--b);border-radius:20px;box-shadow:var(--s);overflow:hidden}.gallery{padding:12px}.heroimg{height:clamp(240px,65vw,480px);background:#f5f1fb;border-radius:15px;display:grid;place-items:center;overflow:hidden}.heroimg img{width:100%;height:100%;object-fit:contain}.thumbs{display:flex;gap:9px;overflow-x:auto;padding:10px 0 2px}.thumbs button{border:2px solid transparent;padding:0;flex:0 0 75px;height:70px;border-radius:10px;overflow:hidden;background:var(--l)}.thumbs button.active{border-color:var(--p)}.thumbs img{width:100%;height:100%;object-fit:cover}.body{padding:18px}.price{font-size:26px;font-weight:800;color:var(--p);margin:0 0 8px}.title{font-size:24px;line-height:1.2;margin:0 0 10px;overflow-wrap:anywhere}.meta{color:var(--m);font-size:14px;margin:5px 0}.description{white-space:pre-line;overflow-wrap:anywhere;margin:18px 0}.facts{background:#faf7ff;border:1px solid var(--b);padding:13px;border-radius:13px;margin:16px 0}.actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px}.action{padding:14px;border-radius:12px;text-align:center;font-weight:800;color:#fff;background:var(--p)}.action.wa{background:#168a4a}.state{padding:28px;text-align:center;color:var(--m)}.footer{text-align: </style></head><body><header class="brand"><a class="back" href="phones-tablets-listings.html" aria-label="Back to listings">‹</a><div class="brand-icon">▣</div><div><h1>OGARS PHONES & TABLETS</h1><p>Product details · Buy and sell with confidence</p></div></header><main><article class="panel"><div id="content" class="state">Loading advert details…</div></article><div class="footer">© 2026 OGARS Platform · Phones & Tablets</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const content=document.getElementById('content');if(!window.supabase||!window.supabase.createClient){content.innerHTML='<div class="state"><strong>Could not start the advert page.</strong><br>Please check your internet connection and reload this page.</div>';throw new Error('Supabase library did not load')}const db=window.supabase.createClient("https://pawqsmcswoypuiihfbrr.supabase.co","sb_publishable_skeGOdL2kqtHNQwXJjmSSg_exGApfnb");const id=new URLSearchParams(location.search).get('id');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){if(v===null||v===undefined||v==='')return 'Contact for price';let n=Number(String(v).replace(/[^0-9.-]/g,''));return Number.isFinite(n)?'GH₵ '+n.toLocaleString('en-GH'):esc(v)}function images(a){let raw=a.photo_urls;if(Array.isArray(raw))return raw;return String(raw||'').split(',').map(x=>x.trim()).filter(Boolean)}function phoneCategory(a){let m=String(a.description||'').match(/OGARS_PHONE_CATEGORY:\s*([^\n\r]+)/i);return m?m[1].trim():''}async function load(){if(!id){content.innerHTML='<div class="state">No advert was selected. Please return to the listings and choose a phone or tablet.</div>';return}try{let {data:a,error}=await db.from('discover_listings').select('*').eq('id',id).single();if(error||!a)throw error||new Error('Not found');if(String(a.listing_type||'').toLowerCase()!=='products & goods'){throw new Error('This advert is not a product listing.')}let photos=images(a),first=photos[0]||'';let desc=String(a.description||'').replace(/OGARS_PHONE_CATEGORY:\s*[^\n\r]+/ig,'').replace(/Phone \/ tablet item type:\s*[^\n\r]+/ig,'').trim();let tel=String(a.phone||'').replace(/[^+\d]/g,'');let wa=String(a.whatsapp||'').replace(/\D/g,'');content.innerHTML=`<div class="gallery"><div class="heroimg" id="hero">${first?`<img id="main-photo" src="${esc(first)}" alt="${esc(a.title||'Phone or tablet')}" onerror="this.parentElement.innerHTML='📱 Photo unavailable'">`:'<span style="font-size:70px">📱</span>'}</div><div class="thumbs" id="thumbs">${photos.map((src,i)=>`<button type="button" class="${i===0?'active':''}" data-src="${esc(src)}" aria-label="View photo ${i+1}"><img src="${esc(src)}" alt="Photo ${i+1}" loading="lazy"></button>`).join('')}</div></div><div class="body"><p class="price">${money(a.price)}</p><h2 class="title">${esc(a.title||'Phone or tablet advert')}</h2><p class="meta">📍 ${esc(a.location||'Ghana')}</p>${phoneCategory(a)?`<div class="facts"><strong>Category:</strong> ${esc(phoneCategory(a))}</div>`:''}<div class="description">${esc(desc||'Contact the seller for more information about this item.')}</div><div class="facts"><strong>Advert posted:</strong> ${a.created_at?new Date(a.created_at).toLocaleDateString('en-GB'):'Date not available'}<br><strong>Item:</strong> Phone, tablet or accessory</div><div class="actions">${tel?`<a class="action" href="tel:${esc(tel)}">☎ Call seller</a>`:''}${wa?`<a class="action wa" href="https://wa.me/${esc(wa)}?text=${encodeURIComponent('Hello, I am interested in your OGARS advert: '+(a.title||'phone/tablet'))}" target="_blank" rel="noopener">WhatsApp seller</a>`:''}</div></div>`;document.getElementById('thumbs')?.addEventListener('click',e=>{let b=e.target.closest('button[data-src]');if(!b)return;let im=document.getElementById('main-photo');if(!im){document.getElementById('hero').innerHTML=`<img id="main-photo" src="${esc(b.dataset.src)}" alt="${esc(a.title||'Product photo')}">`}else im.src=b.dataset.src;document.querySelectorAll('.thumbs button').forEach(x=>x.classList.toggle('active',x===b))});}catch(e){console.error(e);content.innerHTML='<div class="state"><strong>Unable to load this advert.</strong><br>Please go back to Phones & Tablets and select another advert.</div>'}}load();
</script></body></html>
