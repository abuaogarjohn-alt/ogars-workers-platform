
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#512A91">
<title>Advert Details | OGARS MARKET</title>

<style>
:root {
  --purple: #512A91;
  --dark: #38166f;
  --light: #f3edfc;
  --bg: #fbfaff;
  --text: #211b36;
  --muted: #716b83;
  --border: #e6e0f0;
  --white: #fff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

header {
  background: linear-gradient(120deg, #4d32a5, #7655d6);
  color: white;
  text-align: center;
  padding: 16px;
}

header h1 {
  font-size: 23px;
  font-weight: 900;
}

.container {
  width: 100%;
  max-width: 760px;
  margin: auto;
  padding: 12px 14px 35px;
}

.back-button {
  display: inline-block;
  margin: 9px 0 16px;
  color: var(--purple);
  text-decoration: none;
  font-weight: 800;
  font-size: 14px;
}

.advert-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 19px;
  overflow: hidden;
  box-shadow: 0 4px 18px rgba(50, 30, 90, .07);
}

/* PHOTO GALLERY */

.photo-area {
  width: 100%;
  background: var(--light);
}

.main-photo-wrapper {
  position: relative;
  width: 100%;
  height: 300px;
  overflow: hidden;
  background: var(--light);
  touch-action: pan-y;
}

.main-photo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  cursor: pointer;
  user-select: none;
  -webkit-user-drag: none;
}

.photo-count {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(56, 22, 111, .8);
  color: white;
  border-radius: 20px;
  padding: 6px 11px;
  font-size: 13px;
  font-weight: bold;
}

.photo-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 50%;
  background: rgba(56, 22, 111, .65);
  color: white;
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.photo-prev { left: 10px; }
.photo-next { right: 10px; }

.no-photo {
  height: 210px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--purple);
  font-weight: bold;
}

.photo-thumbnails {
  display: flex;
  gap: 8px;
  padding: 9px 12px;
  overflow-x: auto;
  background: white;
}

.photo-thumb {
  width: 75px;
  height: 58px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  flex-shrink: 0;
}

.photo-thumb.selected {
  border-color: var(--purple);
}

/* ADVERT CONTENT */

.content {
  padding: 17px;
}

.listing-type {
  color: var(--purple);
  font-size: 13px;
  font-weight: 900;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.title {
  font-size: 24px;
  line-height: 1.3;
  color: var(--text);
  font-weight: 900;
  margin-bottom: 7px;
  overflow-wrap: anywhere;
}

.price {
  color: var(--purple);
  font-size: 25px;
  font-weight: 900;
  margin: 8px 0 12px;
}

.location {
  color: #514b61;
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 16px;
  overflow-wrap: anywhere;
}

/* ADVERT FEATURES */

.features-box {
  background: #f7f3fc;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin: 12px 0 16px;
}

.features-box h3 {
  color: var(--purple);
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 10px;
}

.feature-list {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.feature-row {
  display: flex;
  flex-direction: row;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 6px;
  padding: 7px 0;
  border-bottom: 1px solid #e7e0f0;
  line-height: 1.45;
}

.feature-row:last-child {
  border-bottom: 0;
}

.feature-label {
  color: var(--purple);
  font-size: 13px;
  font-weight: 900;
}

.feature-value {
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

/* DESCRIPTION */

.description-box {
  background: #f7f3fc;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 13px;
  margin-bottom: 15px;
}

.description-box h3 {
  color: var(--purple);
  font-size: 16px;
  margin-bottom: 7px;
}

.description {
  color: #514b61;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* CONTACT BUTTONS */

.contact-section {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  margin-top: 17px;
}

.contact-button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 10px 7px;
  text-align: center;
  text-decoration: none;
  border-radius: 10px;
  font-weight: 900;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.call-button {
  background: var(--purple);
  color: white;
}

.whatsapp-button {
  background: #eee6fa;
  color: var(--dark);
}

.website-button {
  grid-column: 1 / -1;
  background: #f1edf8;
  color: var(--purple);
  border: 1px solid var(--border);
}

/* OPTIONAL FREE DESCRIPTION */

.extra-description {
  margin-top: 15px;
}

/* FULLSCREEN PHOTO VIEWER */

.photo-viewer {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .95);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  touch-action: pan-y;
}

.photo-viewer.show {
  display: flex;
}

.viewer-image {
  max-width: 94vw;
  max-height: 86vh;
  object-fit: contain;
  user-select: none;
}

.viewer-close {
  position: absolute;
  top: 15px;
  right: 17px;
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.16);
  color: white;
  font-size: 25px;
  cursor: pointer;
}

.viewer-count {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  background: rgba(0,0,0,.5);
  padding: 5px 11px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
}

.viewer-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.17);
  color: white;
  font-size: 26px;
  cursor: pointer;
}

.viewer-prev { left: 12px; }
.viewer-next { right: 12px; }

/* MESSAGES AND FOOTER */

.message {
  background: white;
  border-radius: 15px;
  padding: 35px 20px;
  text-align: center;
  color: var(--muted);
  border: 1px solid var(--border);
}

.message-icon {
  font-size: 38px;
  margin-bottom: 10px;
}

.message h2 {
  color: var(--text);
  margin-bottom: 8px;
  font-size: 20px;
}

.message p {
  font-size: 14px;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  padding: 28px 15px;
  color: var(--muted);
  font-size: 13px;
}

@media (max-width: 480px) {
  header {
    padding: 13px;
  }

  header h1 {
    font-size: 21px;
  }

  .main-photo-wrapper {
    height: 240px;
  }

  .content {
    padding: 14px;
  }

  .title {
    font-size: 21px;
  }

  .price {
    font-size: 23px;
  }

  .features-box {
    padding: 12px;
  }

  .features-box h3 {
    font-size: 17px;
  }

  .feature-row {
    gap: 5px;
    padding: 6px 0;
  }

  .feature-label {
    font-size: 12px;
  }

  .feature-value {
    font-size: 13px;
  }

  .contact-button {
    min-height: 45px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Advert Details</h1>
</header>

<div class="container">

  <a href="my-adverts.html" class="back-button">
    ← Back to My Adverts
  </a>

  <div id="content">
    <div class="message">
      <div class="message-icon">⏳</div>
      <h2>Loading advert</h2>
      <p>Please wait...</p>
    </div>
  </div>

</div>

<footer>
  © 2026 OGARS MARKET. Ghana's Online Marketplace.
</footer>

<!-- FULLSCREEN PHOTO VIEWER -->

<div id="photo-viewer" class="photo-viewer">

  <button type="button" class="viewer-close"
    onclick="closePhotoViewer()">×</button>

  <div id="viewer-count" class="viewer-count">1 / 1</div>

  <button type="button" class="viewer-arrow viewer-prev"
    onclick="previousPhoto()">‹</button>

  <img id="viewer-image" class="viewer-image"
    src="" alt="Advert photo">

  <button type="button" class="viewer-arrow viewer-next"
    onclick="nextPhoto()">›</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

const SUPABASE_URL =
  "https://pawqsmcswoypuiihfbrr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_skeGOdL2kqtHNQwXJjmSSg_exGApfnb";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const content = document.getElementById("content");
const params = new URLSearchParams(window.location.search);
const listingId = params.get("id");

let photos = [];
let currentPhotoIndex = 0;
let touchStartX = 0;
let touchEndX = 0;


/* SECURITY HELPERS */

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value);
}


/* PARSE ADVERT FEATURES */

function parseFeatures(description) {
  const lines = String(description || "").split(/\r?\n/);
  const features = [];
  const remaining = [];

  lines.forEach(line => {
    const trimmed = line.trim();

    if (!trimmed) {
      return;
    }

    const match = trimmed.match(/^([^:]+):\s*(.*)$/);

    if (match && match[1].trim() && match[2].trim()) {
      features.push({
        label: match[1].trim(),
        value: match[2].trim()
      });
    } else {
      remaining.push(trimmed);
    }
  });

  return {
    features,
    remaining: remaining.join("\n")
  };
}


/* FIND A FEATURE BY LABEL */

function getFeature(features, names) {
  const found = features.find(feature =>
    names.some(name =>
      feature.label.toLowerCase().trim() === name.toLowerCase()
    )
  );

  return found ? found.value : "";
}


/* REMOVE LOCATION AND PRICE FROM FEATURE LIST */

function getVisibleFeatures(features) {
  const hiddenLabels = [
    "region",
    "town / area",
    "town/area",
    "town",
    "specific location",
    "location",
    "price",
    "price (gh₵)",
    "price (ghc)",
    "price (ghs)"
  ];

  return features.filter(feature =>
    !hiddenLabels.includes(feature.label.toLowerCase().trim())
  );
}


/* BUILD LOCATION */

function buildLocation(listing, features) {
  const region = getFeature(features, ["Region"]);
  const town = getFeature(features, ["Town / area", "Town/area", "Town"]);
  const specific = getFeature(features, [
    "Specific location",
    "Specific area"
  ]);

  if (region || town || specific) {
    let location = region || "";

    if (town) {
      location += (location ? ", " : "") + town;
    }

    if (specific) {
      location += (location ? " - " : "") + specific;
    }

    return location;
  }

  return String(listing.location || "").trim();
}


/* GET PRICE */

function getAdvertPrice(listing, features) {
  const featurePrice = getFeature(features, [
    "Price",
    "Price (GH₵)",
    "Price (GHC)",
    "Price (GHS)"
  ]);

  if (featurePrice) {
    const cleaned = featurePrice.replace(/[^\d.]/g, "");
    const number = Number(cleaned);

    if (Number.isFinite(number)) {
      return "GH₵ " + number.toLocaleString("en-GH");
    }

    return "GH₵ " + featurePrice;
  }

  if (
    listing.price !== null &&
    listing.price !== undefined &&
    listing.price !== ""
  ) {
    const number = Number(listing.price);

    if (Number.isFinite(number)) {
      return "GH₵ " + number.toLocaleString("en-GH");
    }
  }

  return "";
}


/* LOAD ADVERT */

async function loadAdvert() {
  if (!listingId) {
    showMessage("⚠️", "Advert Not Found", "No advert ID was provided.");
    return;
  }

  try {
    const result = await supabaseClient
      .from("discover_listings")
      .select("*")
      .eq("id", listingId)
      .maybeSingle();

    if (result.error) {
      throw result.error;
    }

    const listing = result.data;

    if (!listing) {
      showMessage(
        "🔎",
        "Advert Not Found",
        "This advert may have been removed or is no longer available."
      );
      return;
    }

    renderAdvert(listing);

  } catch (error) {
    console.error("Advert loading error:", error);

    showMessage(
      "⚠️",
      "Unable to Load Advert",
      error.message || "Please try again."
    );
  }
}


/* RENDER ADVERT */

function renderAdvert(listing) {

  /* PHOTOS */

  photos = [];

  if (listing.photo_urls) {
    if (Array.isArray(listing.photo_urls)) {
      photos = listing.photo_urls.filter(Boolean);
    } else {
      const raw = String(listing.photo_urls).trim();

      try {
        if (raw.startsWith("[")) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            photos = parsed.filter(Boolean);
          }
        }
      } catch (error) {
        console.warn("Photo URL parsing:", error);
      }

      if (!photos.length) {
        photos = raw.split(",").map(url => url.trim()).filter(Boolean);
      }
    }
  }

  currentPhotoIndex = 0;

  let photoHtml = "";

  if (photos.length) {
    photoHtml = `
      <div class="photo-area">
        <div class="main-photo-wrapper" id="main-photo-wrapper">

          <img
            id="main-photo"
            class="main-photo"
            src="${escapeAttribute(photos[0])}"
            alt="Advert photo"
            fetchpriority="high"
            decoding="async"
            onclick="openPhotoViewer()"
          >

          ${
            photos.length > 1
              ? `
                <div id="photo-count" class="photo-count">
                  1 / ${photos.length}
                </div>

                <button type="button"
                  class="photo-arrow photo-prev"
                  onclick="previousPhoto()"
                  aria-label="Previous photo">‹</button>

                <button type="button"
                  class="photo-arrow photo-next"
                  onclick="nextPhoto()"
                  aria-label="Next photo">›</button>
              `
              : ""
          }
        </div>

        ${
          photos.length > 1
            ? `
              <div class="photo-thumbnails">
                ${photos.map((photo, index) => `
                  <img
                    src="${escapeAttribute(photo)}"
                    class="photo-thumb ${index === 0 ? "selected" : ""}"
                    onclick="showPhoto(${index})"
                    alt="Photo ${index + 1}"
                    loading="lazy"
                    decoding="async"
                  >
                `).join("")}
              </div>
            `
            : ""
        }
      </div>
    `;
  } else {
    photoHtml = `
      <div class="photo-area">
        <div class="no-photo">📷 No Photo Available</div>
      </div>
    `;
  }


  /* FEATURES, LOCATION AND PRICE */

  const parsed = parseFeatures(listing.description || "");
  const features = parsed.features;

  const location = buildLocation(listing, features);
  const price = getAdvertPrice(listing, features);

  const visibleFeatures = getVisibleFeatures(features);

  let featuresHtml = "";

  if (visibleFeatures.length) {
    featuresHtml = `
      <div class="features-box">
        <h3>Advert Features &amp; Information</h3>

        <div class="feature-list">
          ${visibleFeatures.map(feature => `
            <div class="feature-row">
              <span class="feature-label">
                ${escapeHtml(feature.label)}
              </span>

              <span class="feature-value">
                ${escapeHtml(feature.value)}
              </span>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }


  /* CONTACT BUTTONS */

  let contactHtml = "";

  const phone = String(listing.phone || "").trim();
  const whatsappNumber = String(
    listing.whatsapp || listing.phone || ""
  ).replace(/\D/g, "");

  if (phone) {
    contactHtml += `
      <a class="contact-button call-button"
        href="tel:${escapeAttribute(phone)}">
        📞 Call
      </a>
    `;
  }

  if (whatsappNumber) {
    let whatsapp = whatsappNumber;

    if (whatsapp.startsWith("0")) {
      whatsapp = "233" + whatsapp.substring(1);
    }

    const message =
      "Hello, I saw your advert for \"" +
      (listing.title || "this advert") +
      "\" on OGARS MARKET. I would like to make an enquiry. Please can you give me more information?";

    const whatsappUrl =
      "https://wa.me/" + whatsapp +
      "?text=" + encodeURIComponent(message);

    contactHtml += `
      <a class="contact-button whatsapp-button"
        href="${escapeAttribute(whatsappUrl)}"
        target="_blank"
        rel="noopener noreferrer">
        💬 WhatsApp
      </a>
    `;
  }

  if (listing.website) {
    let website = String(listing.website).trim();

    if (!/^https?:\/\//i.test(website)) {
      website = "https://" + website;
    }

    contactHtml += `
      <a class="contact-button website-button"
        href="${escapeAttribute(website)}"
        target="_blank"
        rel="noopener noreferrer">
        🌐 Visit Website
      </a>
    `;
  }


  /* REMAINING DESCRIPTION */

  const extraDescription = parsed.remaining
    ? `
      <div class="description-box extra-description">
        <h3>About This Advert</h3>
        <div class="description">${escapeHtml(parsed.remaining)}</div>
      </div>
    `
    : "";


  /* DISPLAY PAGE */

  content.innerHTML = `
    <div class="advert-card">

      ${photoHtml}

      <div class="content">

        <div class="listing-type">
          ${escapeHtml(listing.listing_type || "Advertisement")}
        </div>

        <h2 class="title">
          ${escapeHtml(listing.title || "Untitled Advert")}
        </h2>

        ${price ? `
          <div class="price">${escapeHtml(price)}</div>
        ` : ""}

        ${location ? `
          <div class="location">
            📍 ${escapeHtml(location)}
          </div>
        ` : ""}

        ${featuresHtml}

        ${extraDescription}

        ${contactHtml ? `
          <div class="contact-section">
            ${contactHtml}
          </div>
        ` : ""}

      </div>
    </div>
  `;

  setupSwipe();
  preloadNearbyPhotos();
}


/* PRELOAD NEARBY PHOTOS */

function preloadNearbyPhotos() {
  if (photos.length <= 1) return;

  [currentPhotoIndex + 1, currentPhotoIndex - 1].forEach(index => {
    if (index >= 0 && index < photos.length) {
      const image = new Image();
      image.decoding = "async";
      image.src = photos[index];
    }
  });
}


/* SHOW PHOTO */

function showPhoto(index) {
  if (!photos.length) return;

  if (index < 0) index = photos.length - 1;
  if (index >= photos.length) index = 0;

  currentPhotoIndex = index;

  const mainPhoto = document.getElementById("main-photo");

  if (mainPhoto) {
    mainPhoto.src = photos[index];
  }

  const count = document.getElementById("photo-count");

  if (count) {
    count.textContent = (index + 1) + " / " + photos.length;
  }

  document.querySelectorAll(".photo-thumb").forEach((thumb, i) => {
    thumb.classList.toggle("selected", i === index);
  });

  const thumbnail = document.querySelectorAll(".photo-thumb")[index];

  if (thumbnail) {
    thumbnail.scrollIntoView({
      behavior: "smooth",
      block: "nearest",
      inline: "center"
    });
  }

  const viewer = document.getElementById("photo-viewer");

  if (viewer.classList.contains("show")) {
    updateViewer();
  }

  preloadNearbyPhotos();
}


function nextPhoto() {
  if (photos.length > 1) {
    showPhoto(currentPhotoIndex + 1);
  }
}


function previousPhoto() {
  if (photos.length > 1) {
    showPhoto(currentPhotoIndex - 1);
  }
}


/* FULLSCREEN VIEWER */

function openPhotoViewer() {
  if (!photos.length) return;

  document.getElementById("photo-viewer").classList.add("show");
  document.body.style.overflow = "hidden";

  updateViewer();
}


function closePhotoViewer() {
  document.getElementById("photo-viewer").classList.remove("show");
  document.body.style.overflow = "";
}


function updateViewer() {
  const image = document.getElementById("viewer-image");
  const count = document.getElementById("viewer-count");

  if (!image || !count || !photos.length) return;

  image.src = photos[currentPhotoIndex];
  count.textContent = (currentPhotoIndex + 1) + " / " + photos.length;
}


/* SWIPE SUPPORT */

function handleSwipe() {
  const difference = touchStartX - touchEndX;

  if (Math.abs(difference) < 50) return;

  if (difference > 0) {
    nextPhoto();
  } else {
    previousPhoto();
  }
}


function setupSwipe() {
  const wrapper = document.getElementById("main-photo-wrapper");

  if (!wrapper) return;

  wrapper.addEventListener("touchstart", event => {
    touchStartX = event.changedTouches[0].screenX;
  }, { passive: true });

  wrapper.addEventListener("touchend", event => {
    touchEndX = event.changedTouches[0].screenX;
    handleSwipe();
  }, { passive: true });
}


/* VIEWER SWIPE */

const viewer = document.getElementById("photo-viewer");

viewer.addEventListener("touchstart", event => {
  touchStartX = event.changedTouches[0].screenX;
}, { passive: true });

viewer.addEventListener("touchend", event => {
  touchEndX = event.changedTouches[0].screenX;
  handleSwipe();
}, { passive: true });


/* KEYBOARD CONTROLS */

document.addEventListener("keydown", event => {
  const viewerElement = document.getElementById("photo-viewer");

  if (!viewerElement.classList.contains("show")) return;

  if (event.key === "ArrowRight") nextPhoto();
  if (event.key === "ArrowLeft") previousPhoto();
  if (event.key === "Escape") closePhotoViewer();
});


/* MESSAGE */

function showMessage(icon, title, message) {
  content.innerHTML = `
    <div class="message">
      <div class="message-icon">${escapeHtml(icon)}</div>
      <h2>${escapeHtml(title)}</h2>
      <p>${escapeHtml(message)}</p>
    </div>
  `;
}


/* START */

loadAdvert();
