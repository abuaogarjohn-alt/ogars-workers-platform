<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Advert Details | OGARS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f5;
      color: #1f2937;
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, #006b00, #008f00);
      color: white;
      padding: 20px 16px 25px;
      text-align: center;
    }

    .logo {
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 9px;
    }

    header h1 {
      font-size: 25px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: 15px 14px 35px;
    }

    .back-button {
      display: inline-block;
      margin: 4px 0 15px;
      color: #008000;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    .advert-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 18px rgba(0,0,0,0.07);
    }

    .photo-area {
      width: 100%;
      background: #edf4ed;
      position: relative;
      overflow: hidden;
    }

    .main-photo-wrapper {
      position: relative;
      width: 100%;
      height: 300px;
      touch-action: pan-y;
      overflow: hidden;
      background: #edf4ed;
    }

    .main-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    .photo-count {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.65);
      color: white;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: bold;
      z-index: 5;
    }

    .photo-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.52);
      color: white;
      font-size: 22px;
      cursor: pointer;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-arrow:hover {
      background: rgba(0,0,0,0.72);
    }

    .photo-prev {
      left: 10px;
    }

    .photo-next {
      right: 10px;
    }

    .no-photo {
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #008000;
      font-weight: bold;
    }

    .photo-thumbnails {
      display: flex;
      gap: 8px;
      padding: 10px;
      overflow-x: auto;
      background: white;
      scrollbar-width: thin;
    }

    .photo-thumb {
      width: 65px;
      height: 55px;
      object-fit: cover;
      border-radius: 7px;
      cursor: pointer;
      border: 2px solid transparent;
      flex-shrink: 0;
      user-select: none;
    }

    .photo-thumb.selected {
      border-color: #008000;
    }

    .content {
      padding: 20px;
    }

    .listing-type {
      color: #008000;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .title {
      font-size: 25px;
      line-height: 1.25;
      color: #111827;
      margin-bottom: 12px;
    }

    .location {
      color: #555;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .description-box {
      background: #f7f9f7;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 18px;
    }

    .description-box h3 {
      color: #222;
      font-size: 16px;
      margin-bottom: 7px;
    }

    .description {
      color: #555;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .details-box {
      border-top: 1px solid #e5e7eb;
      padding-top: 16px;
      margin-top: 5px;
    }

    .detail-row {
      display: flex;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }

    .detail-label {
      font-weight: bold;
      min-width: 105px;
      color: #333;
    }

    .detail-value {
      color: #555;
      word-break: break-word;
    }

    .contact-section {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    .contact-button {
      display: block;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 13px;
      font-weight: bold;
      font-size: 14px;
    }

    .call-button {
      background: #008000;
      color: white;
    }

    .whatsapp-button {
      background: #e9f7e9;
      color: #087408;
    }

    .website-button {
      background: #f1f3f2;
      color: #333;
      border: 1px solid #ddd;
    }

    .expiry-box {
      margin-top: 20px;
      background: #f7f9f7;
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 13px;
      color: #555;
    }

    .status-active {
      color: #087408;
      font-weight: bold;
    }

    .status-expired {
      color: #a00000;
      font-weight: bold;
    }

    /* FULLSCREEN PHOTO VIEWER */

    .photo-viewer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.94);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      touch-action: pan-y;
    }

    .photo-viewer.show {
      display: flex;
    }

    .viewer-image {
      max-width: 94vw;
      max-height: 86vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .viewer-close {
      position: absolute;
      top: 15px;
      right: 17px;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 25px;
      cursor: pointer;
      z-index: 10;
    }

    .viewer-count {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .viewer-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.16);
      color: white;
      font-size: 27px;
      cursor: pointer;
      z-index: 10;
    }

    .viewer-prev {
      left: 15px;
    }

    .viewer-next {
      right: 15px;
    }

    .message {
      background: white;
      border-radius: 16px;
      padding: 35px 20px;
      text-align: center;
      color: #666;
      border: 1px solid #e5e7eb;
      box-shadow: 0 3px 15px rgba(0,0,0,0.05);
    }

    .message-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .message h2 {
      color: #222;
      margin-bottom: 8px;
      font-size: 20px;
    }

    .message p {
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 480px) {

      .main-photo-wrapper {
        height: 240px;
      }

      .title {
        font-size: 21px;
      }

      .content {
        padding: 17px;
      }

      .photo-arrow {
        width: 34px;
        height: 34px;
        font-size: 19px;
      }

      .viewer-arrow {
        width: 38px;
        height: 38px;
        font-size: 23px;
      }

      .viewer-prev {
        left: 8px;
      }

      .viewer-next {
        right: 8px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    OGAR'S WORKERS PLATFORM
  </div>

  <h1>Advert Details</h1>

</header>


<div class="container">

  <a
    href="my-adverts.html"
    class="back-button"
  >
    ← Back to My Adverts
  </a>


  <div id="content">

    <div class="message">

      <div class="message-icon">
        ⏳
      </div>

      <h2>
        Loading advert
      </h2>

      <p>
        Please wait...
      </p>

    </div>

  </div>

</div>


<footer>
  © 2026 OGARS Workers Platform
</footer>


<!-- FULLSCREEN PHOTO VIEWER -->

<div
  id="photo-viewer"
  class="photo-viewer"
>

  <button
    type="button"
    class="viewer-close"
    onclick="closePhotoViewer()"
  >
    ×
  </button>


  <div
    id="viewer-count"
    class="viewer-count"
  >
    1 / 1
  </div>


  <button
    type="button"
    class="viewer-arrow viewer-prev"
    onclick="previousPhoto()"
  >
    ‹
  </button>


  <img
    id="viewer-image"
    class="viewer-image"
    src=""
    alt="Advert photo"
  >


  <button
    type="button"
    class="viewer-arrow viewer-next"
    onclick="nextPhoto()"
  >
    ›
  </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://pawqsmcswoypuiihfbrr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_skeGOdL2kqtHNQwXJjmSSg_exGApfnb";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const content =
  document.getElementById(
    "content"
  );


const params =
  new URLSearchParams(
    window.location.search
  );


const listingId =
  params.get("id");


let photos = [];

let currentPhotoIndex = 0;

let touchStartX = 0;

let touchEndX = 0;


/* LOAD ADVERT */

async function loadAdvert() {

  if (!listingId) {

    showMessage(
      "⚠️",
      "Advert Not Found",
      "No advert ID was provided."
    );

    return;
  }


  const result =
    await supabaseClient
      .from("discover_listings")
      .select("*")
      .eq("id", listingId)
      .maybeSingle();


  if (result.error) {

    showMessage(
      "⚠️",
      "Unable to Load Advert",
      result.error.message
    );

    return;
  }


  const listing =
    result.data;


  if (!listing) {

    showMessage(
      "🔎",
      "Advert Not Found",
      "This advert may have been removed or is no longer available."
    );

    return;
  }


  /* PHOTOS */

  photos = [];

  if (
    listing.photo_urls &&
    listing.photo_urls.trim() !== ""
  ) {

    photos =
      listing.photo_urls
        .split(",")
        .map(
          function(url) {
            return url.trim();
          }
        )
        .filter(
          function(url) {
            return url !== "";
          }
        );

  }


  currentPhotoIndex = 0;


  let photoHtml = "";


  if (photos.length > 0) {

    photoHtml = `

      <div class="photo-area">

        <div
          class="main-photo-wrapper"
          id="main-photo-wrapper"
        >

          <img
            id="main-photo"
            class="main-photo"
            src="${escapeAttribute(photos[0])}"
            alt="Advert photo"
            onclick="openPhotoViewer()"
          >


          ${
            photos.length > 1
              ? `

                <div
                  id="photo-count"
                  class="photo-count"
                >
                  1 / ${photos.length}
                </div>


                <button
                  type="button"
                  class="photo-arrow photo-prev"
                  onclick="previousPhoto()"
                >
                  ‹
                </button>


                <button
                  type="button"
                  class="photo-arrow photo-next"
                  onclick="nextPhoto()"
                >
                  ›
                </button>

              `
              : ""
          }

        </div>


        ${
          photos.length > 1
            ? `

              <div
                class="photo-thumbnails"
                id="photo-thumbnails"
              >

                ${photos.map(
                  function(photo, index) {

                    return `

                      <img
                        src="${escapeAttribute(photo)}"
                        class="photo-thumb ${
                          index === 0
                            ? "selected"
                            : ""
                        }"
                        onclick="showPhoto(${index})"
                        alt="Photo ${index + 1}"
                        loading="lazy"
                      >

                    `;

                  }
                ).join("")}

              </div>

            `
            : ""
        }

      </div>

    `;

  } else {

    photoHtml = `

      <div class="photo-area">

        <div class="no-photo">
          📷 No Photo Available
        </div>

      </div>

    `;

  }


  /* EXPIRY */

  const expiryDate =
    listing.expires_at
      ? new Date(
          listing.expires_at
        )
      : null;


  const isExpired =
    !expiryDate ||
    expiryDate <= new Date();


  let expiryHtml = "";


  if (expiryDate) {

    expiryHtml = `

      <div class="expiry-box">

        ${
          isExpired
            ? `
              <span class="status-expired">
                🔴 Advert Expired
              </span>
            `
            : `
              <span class="status-active">
                🟢 Advert Active
              </span>
            `
        }

        <br>

        ${
          isExpired
            ? "Expired on: "
            : "Expires on: "
        }

        ${escapeHtml(
          expiryDate.toLocaleString()
        )}

      </div>

    `;

  }


  /* CONTACT BUTTONS */

  let contactHtml = "";


  if (
    listing.phone &&
    listing.phone.trim() !== ""
  ) {

    const phone =
      listing.phone.trim();


    contactHtml += `

      <a
        class="contact-button call-button"
        href="tel:${escapeAttribute(phone)}"
      >
        📞 Call Advertiser
      </a>

    `;

  }


  if (
    listing.whatsapp &&
    listing.whatsapp.trim() !== ""
  ) {

    let whatsapp =
      listing.whatsapp
        .replace(
          /\D/g,
          ""
        );


    if (
      whatsapp.startsWith("0")
    ) {

      whatsapp =
        "233" +
        whatsapp.substring(1);

    }


    /*
      CUSTOMIZED WHATSAPP MESSAGE
    */

    const advertTitle =
      listing.title ||
      "this advert";


    const whatsappMessage =
      "Hello, I saw your advert for \"" +
      advertTitle +
      "\" on OGAR'S Workers Platform. " +
      "I would like to make an enquiry. " +
      "Please, can you give me more information?";


    const whatsappUrl =
      "https://wa.me/" +
      whatsapp +
      "?text=" +
      encodeURIComponent(
        whatsappMessage
      );


    contactHtml += `

      <a
        class="contact-button whatsapp-button"
        href="${escapeAttribute(whatsappUrl)}"
        target="_blank"
        rel="noopener"
      >
        💬 Contact on WhatsApp
      </a>

    `;

  }


  if (
    listing.website &&
    listing.website.trim() !== ""
  ) {

    let website =
      listing.website.trim();


    if (
      !/^https?:\/\//i.test(
        website
      )
    ) {

      website =
        "https://" +
        website;

    }


    contactHtml += `

      <a
        class="contact-button website-button"
        href="${escapeAttribute(website)}"
        target="_blank"
        rel="noopener"
      >
        🌐 Visit Website
      </a>

    `;

  }


  /* OTHER DETAILS */

  let detailsHtml = "";


  if (
    listing.location &&
    listing.location.trim() !== ""
  ) {

    detailsHtml += `

      <div class="detail-row">

        <div class="detail-label">
          📍 Location
        </div>

        <div class="detail-value">
          ${escapeHtml(
            listing.location
          )}
        </div>

      </div>

    `;

  }


  if (
    listing.event_date &&
    String(listing.event_date).trim() !== ""
  ) {

    detailsHtml += `

      <div class="detail-row">

        <div class="detail-label">
          📅 Event Date
        </div>

        <div class="detail-value">
          ${escapeHtml(
            listing.event_date
          )}
        </div>

      </div>

    `;

  }


  if (
    listing.event_time &&
    String(listing.event_time).trim() !== ""
  ) {

    detailsHtml += `

      <div class="detail-row">

        <div class="detail-label">
          🕐 Event Time
        </div>

        <div class="detail-value">
          ${escapeHtml(
            listing.event_time
          )}

        </div>

      </div>

    `;

  }


  content.innerHTML = `

    <div class="advert-card">

      ${photoHtml}


      <div class="content">

        <div class="listing-type">

          ${escapeHtml(
            listing.listing_type ||
            "Advertisement"
          )}

        </div>


        <h2 class="title">

          ${escapeHtml(
            listing.title ||
            "Untitled Advert"
          )}

        </h2>


        ${
          listing.location
            ? `
              <div class="location">
                📍 ${escapeHtml(
                  listing.location
                )}
              </div>
            `
            : ""
        }


        <div class="description-box">

          <h3>
            About This Advert
          </h3>

          <div class="description">

            ${escapeHtml(
              listing.description ||
              "No description provided."
            )}

          </div>

        </div>


        ${
          detailsHtml
            ? `
              <div class="details-box">

                ${detailsHtml}

              </div>
            `
            : ""
        }


        ${
          contactHtml
            ? `
              <div class="contact-section">

                ${contactHtml}

              </div>
            `
            : ""
        }


        ${expiryHtml}

      </div>

    </div>

  `;


  /* PRELOAD PHOTOS */

  photos.forEach(
    function(photo) {

      const image =
        new Image();

      image.src =
        photo;

    }
  );


  setupSwipe();
}


/* SHOW PHOTO */

function showPhoto(index) {

  if (!photos.length) {
    return;
  }


  if (index < 0) {

    index =
      photos.length - 1;

  }


  if (
    index >= photos.length
  ) {

    index = 0;

  }


  currentPhotoIndex =
    index;


  const mainPhoto =
    document.getElementById(
      "main-photo"
    );


  if (mainPhoto) {

    mainPhoto.src =
      photos[index];

  }


  const count =
    document.getElementById(
      "photo-count"
    );


  if (count) {

    count.textContent =
      (index + 1) +
      " / " +
      photos.length;

  }


  document
    .querySelectorAll(
      ".photo-thumb"
    )
    .forEach(
      function(thumb, thumbIndex) {

        thumb.classList.toggle(
          "selected",
          thumbIndex === index
        );

      }
    );


  const thumbnail =
    document.querySelectorAll(
      ".photo-thumb"
    )[index];


  if (thumbnail) {

    thumbnail.scrollIntoView({
      behavior: "smooth",
      block: "nearest",
      inline: "center"
    });

  }

}


/* NEXT PHOTO */

function nextPhoto() {

  if (photos.length <= 1) {
    return;
  }


  showPhoto(
    currentPhotoIndex + 1
  );

}


/* PREVIOUS PHOTO */

function previousPhoto() {

  if (photos.length <= 1) {
    return;
  }


  showPhoto(
    currentPhotoIndex - 1
  );

}


/* OPEN FULLSCREEN VIEWER */

function openPhotoViewer() {

  if (!photos.length) {
    return;
  }


  const viewer =
    document.getElementById(
      "photo-viewer"
    );


  if (!viewer) {
    return;
  }


  viewer.classList.add(
    "show"
  );


  document.body.style.overflow =
    "hidden";


  updateViewer();

}


/* CLOSE FULLSCREEN VIEWER */

function closePhotoViewer() {

  const viewer =
    document.getElementById(
      "photo-viewer"
    );


  if (!viewer) {
    return;
  }


  viewer.classList.remove(
    "show"
  );


  document.body.style.overflow =
    "";

}


/* UPDATE FULLSCREEN VIEWER */

function updateViewer() {

  const image =
    document.getElementById(
      "viewer-image"
    );


  const count =
    document.getElementById(
      "viewer-count"
    );


  if (!image || !count) {
    return;
  }


  image.src =
    photos[currentPhotoIndex];


  count.textContent =
    (currentPhotoIndex + 1) +
    " / " +
    photos.length;

}


/* SETUP SWIPE */

function setupSwipe() {

  const wrapper =
    document.getElementById(
      "main-photo-wrapper"
    );


  if (!wrapper) {
    return;
  }


  wrapper.addEventListener(
    "touchstart",
    function(event) {

      touchStartX =
        event.changedTouches[0].screenX;

    },
    {
      passive: true
    }
  );


  wrapper.addEventListener(
    "touchend",
    function(event) {

      touchEndX =
        event.changedTouches[0].screenX;


      handleSwipe();

    },
    {
      passive: true
    }
  );


  const viewer =
    document.getElementById(
      "photo-viewer"
    );


  if (viewer) {

    viewer.addEventListener(
      "touchstart",
      function(event) {

        touchStartX =
          event.changedTouches[0].screenX;

      },
      {
        passive: true
      }
    );


    viewer.addEventListener(
      "touchend",
      function(event) {

        touchEndX =
          event.changedTouches[0].screenX;


        handleViewerSwipe();

      },
      {
        passive: true
      }
    );

  }

}


/* HANDLE MAIN PHOTO SWIPE */

function handleSwipe() {

  const difference =
    touchStartX -
    touchEndX;


  if (
    Math.abs(difference) <
    50
  ) {

    return;

  }


  if (difference > 0) {

    nextPhoto();

  } else {

    previousPhoto();

  }

}


/* HANDLE FULLSCREEN SWIPE */

function handleViewerSwipe() {

  const difference =
    touchStartX -
    touchEndX;


  if (
    Math.abs(difference) <
    50
  ) {

    return;

  }


  if (difference > 0) {

    nextPhoto();

    updateViewer();

  } else {

    previousPhoto();

    updateViewer();

  }

}


/* KEYBOARD CONTROLS */

document.addEventListener(
  "keydown",
  function(event) {

    const viewer =
      document.getElementById(
        "photo-viewer"
      );


    if (
      !viewer ||
      !viewer.classList.contains(
        "show"
      )
    ) {

      return;

    }


    if (
      event.key ===
      "ArrowRight"
    ) {

      nextPhoto();

      updateViewer();

    }


    if (
      event.key ===
      "ArrowLeft"
    ) {

      previousPhoto();

      updateViewer();

    }


    if (
      event.key ===
      "Escape"
    ) {

      closePhotoViewer();

    }

  }
);


/* MESSAGE */

function showMessage(
  icon,
  title,
  message
) {

  content.innerHTML = `

    <div class="message">

      <div class="message-icon">
        ${icon}
      </div>

      <h2>
        ${escapeHtml(title)}
      </h2>

      <p>
        ${escapeHtml(message)}
      </p>

    </div>

  `;

}


/* SECURITY HELPERS */

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}
