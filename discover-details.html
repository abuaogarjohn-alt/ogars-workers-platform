<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Advert Details | OGARS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f5;
      color: #1f2937;
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, #006b00, #008f00);
      color: white;
      padding: 20px 16px 25px;
      text-align: center;
    }

    .logo {
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 9px;
    }

    header h1 {
      font-size: 25px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: 15px 14px 35px;
    }

    .back-button {
      display: inline-block;
      margin: 4px 0 15px;
      color: #008000;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    .advert-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 18px rgba(0,0,0,0.07);
    }

    .photo-area {
      width: 100%;
      background: #edf4ed;
    }

    .main-photo {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
    }

    .no-photo {
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #008000;
      font-weight: bold;
    }

    .photo-thumbnails {
      display: flex;
      gap: 8px;
      padding: 10px;
      overflow-x: auto;
      background: white;
    }

    .photo-thumb {
      width: 65px;
      height: 55px;
      object-fit: cover;
      border-radius: 7px;
      cursor: pointer;
      border: 2px solid transparent;
      flex-shrink: 0;
    }

    .photo-thumb.selected {
      border-color: #008000;
    }

    .content {
      padding: 20px;
    }

    .listing-type {
      color: #008000;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .title {
      font-size: 25px;
      line-height: 1.25;
      color: #111827;
      margin-bottom: 12px;
    }

    .location {
      color: #555;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .description-box {
      background: #f7f9f7;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 18px;
    }

    .description-box h3 {
      color: #222;
      font-size: 16px;
      margin-bottom: 7px;
    }

    .description {
      color: #555;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .details-box {
      border-top: 1px solid #e5e7eb;
      padding-top: 16px;
      margin-top: 5px;
    }

    .detail-row {
      display: flex;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }

    .detail-label {
      font-weight: bold;
      min-width: 105px;
      color: #333;
    }

    .detail-value {
      color: #555;
      word-break: break-word;
    }

    .contact-section {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    .contact-button {
      display: block;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 13px;
      font-weight: bold;
      font-size: 14px;
    }

    .call-button {
      background: #008000;
      color: white;
    }

    .whatsapp-button {
      background: #e9f7e9;
      color: #087408;
    }

    .website-button {
      background: #f1f3f2;
      color: #333;
      border: 1px solid #ddd;
    }

    .expiry-box {
      margin-top: 20px;
      background: #f7f9f7;
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 13px;
      color: #555;
    }

    .status-active {
      color: #087408;
      font-weight: bold;
    }

    .status-expired {
      color: #a00000;
      font-weight: bold;
    }

    .message {
      background: white;
      border-radius: 16px;
      padding: 35px 20px;
      text-align: center;
      color: #666;
      border: 1px solid #e5e7eb;
      box-shadow: 0 3px 15px rgba(0,0,0,0.05);
    }

    .message-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .message h2 {
      color: #222;
      margin-bottom: 8px;
      font-size: 20px;
    }

    .message p {
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 480px) {

      .main-photo {
        height: 240px;
      }

      .title {
        font-size: 21px;
      }

      .content {
        padding: 17px;
      }

    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    OGAR'S WORKERS PLATFORM
  </div>

  <h1>Advert Details</h1>

</header>


<div class="container">

  <a
    href="my-adverts.html"
    class="back-button"
  >
    ← Back to My Adverts
  </a>


  <div id="content">

    <div class="message">

      <div class="message-icon">
        ⏳
      </div>

      <h2>
        Loading advert
      </h2>

      <p>
        Please wait...
      </p>

    </div>

  </div>

</div>


<footer>
  © 2026 OGARS Workers Platform
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://pawqsmcswoypuiihfbrr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_skeGOdL2kqtHNQwXJjmSSg_exGApfnb";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const content =
  document.getElementById(
    "content"
  );


/* GET ADVERT ID FROM URL */

const params =
  new URLSearchParams(
    window.location.search
  );

const listingId =
  params.get("id");


/* LOAD ADVERT */

async function loadAdvert() {

  if (!listingId) {

    showMessage(
      "⚠️",
      "Advert Not Found",
      "No advert ID was provided."
    );

    return;

  }


  const result =
    await supabaseClient
      .from("discover_listings")
      .select("*")
      .eq("id", listingId)
      .maybeSingle();


  if (result.error) {

    showMessage(
      "⚠️",
      "Unable to Load Advert",
      result.error.message
    );

    return;

  }


  const listing =
    result.data;


  if (!listing) {

    showMessage(
      "🔎",
      "Advert Not Found",
      "This advert may have been removed or is no longer available."
    );

    return;

  }


  /* PHOTOS */

  let photos = [];

  if (
    listing.photo_urls &&
    listing.photo_urls.trim() !== ""
  ) {

    photos =
      listing.photo_urls
        .split(",")
        .map(
          function(url) {
            return url.trim();
          }
        )
        .filter(
          function(url) {
            return url !== "";
          }
        );

  }


  let photoHtml = "";

  if (photos.length > 0) {

    photoHtml = `

      <div class="photo-area">

        <img
          id="main-photo"
          class="main-photo"
          src="${escapeAttribute(photos[0])}"
          alt="Advert photo"
        >

        ${
          photos.length > 1
            ? `
              <div class="photo-thumbnails">

                ${photos.map(
                  function(photo, index) {

                    return `

                      <img
                        src="${escapeAttribute(photo)}"
                        class="photo-thumb ${
                          index === 0
                            ? "selected"
                            : ""
                        }"
                        onclick="changePhoto(this, '${escapeAttribute(photo)}')"
                        alt="Photo ${index + 1}"
                      >

                    `;

                  }
                ).join("")}

              </div>
            `
            : ""
        }

      </div>

    `;

  } else {

    photoHtml = `

      <div class="photo-area">

        <div class="no-photo">
          📷 No Photo Available
        </div>

      </div>

    `;

  }


  /* EXPIRY */

  const expiryDate =
    listing.expires_at
      ? new Date(
          listing.expires_at
        )
      : null;


  const isExpired =
    !expiryDate ||
    expiryDate <= new Date();


  let expiryHtml = "";

  if (expiryDate) {

    expiryHtml = `

      <div class="expiry-box">

        ${
          isExpired
            ? `
              <span class="status-expired">
                🔴 Advert Expired
              </span>
            `
            : `
              <span class="status-active">
                🟢 Advert Active
              </span>
            `
        }

        <br>

        ${
          isExpired
            ? "Expired on: "
            : "Expires on: "
        }

        ${escapeHtml(
          expiryDate.toLocaleString()
        )}

      </div>

    `;

  }


  /* CONTACT BUTTONS */

  let contactHtml = "";


  if (
    listing.phone &&
    listing.phone.trim() !== ""
  ) {

    const phone =
      listing.phone.trim();


    contactHtml += `

      <a
        class="contact-button call-button"
        href="tel:${escapeAttribute(phone)}"
      >
        📞 Call Advertiser
      </a>

    `;

  }


  if (
    listing.whatsapp &&
    listing.whatsapp.trim() !== ""
  ) {

    let whatsapp =
      listing.whatsapp
        .replace(
          /\D/g,
          ""
        );


    if (
      whatsapp.startsWith("0")
    ) {

      whatsapp =
        "233" +
        whatsapp.substring(1);

    }


    contactHtml += `

      <a
        class="contact-button whatsapp-button"
        href="https://wa.me/${escapeAttribute(whatsapp)}"
        target="_blank"
        rel="noopener"
      >
        💬 Contact on WhatsApp
      </a>

    `;

  }


  if (
    listing.website &&
    listing.website.trim() !== ""
  ) {

    let website =
      listing.website.trim();


    if (
      !/^https?:\/\//i.test(
        website
      )
    ) {

      website =
        "https://" +
        website;

    }


    contactHtml += `

      <a
        class="contact-button website-button"
        href="${escapeAttribute(website)}"
        target="_blank"
        rel="noopener"
      >
        🌐 Visit Website
      </a>

    `;

  }


  /* OTHER DETAILS */

  let detailsHtml = "";


  if (
    listing.location &&
    listing.location.trim() !== ""
  ) {

    detailsHtml += `

      <div class="detail-row">

        <div class="detail-label">
          📍 Location
        </div>

        <div class="detail-value">
          ${escapeHtml(
            listing.location
          )}
        </div>

      </div>

    `;

  }


  if (
    listing.event_date &&
    String(listing.event_date).trim() !== ""
  ) {

    detailsHtml += `

      <div class="detail-row">

        <div class="detail-label">
          📅 Event Date
        </div>

        <div class="detail-value">
          ${escapeHtml(
            listing.event_date
          )}
        </div>

      </div>

    `;

  }


  if (
    listing.event_time &&
    String(listing.event_time).trim() !== ""
  ) {

    detailsHtml += `

      <div class="detail-row">

        <div class="detail-label">
          🕐 Event Time
        </div>

        <div class="detail-value">
          ${escapeHtml(
            listing.event_time
          )}
        </div>

      </div>

    `;

  }


  content.innerHTML = `

    <div class="advert-card">

      ${photoHtml}

      <div class="content">

        <div class="listing-type">

          ${escapeHtml(
            listing.listing_type ||
            "Advertisement"
          )}

        </div>

        <h2 class="title">

          ${escapeHtml(
            listing.title ||
            "Untitled Advert"
          )}

        </h2>

        ${
          listing.location
            ? `
              <div class="location">
                📍 ${escapeHtml(
                  listing.location
                )}
              </div>
            `
            : ""
        }


        <div class="description-box">

          <h3>
            About This Advert
          </h3>

          <div class="description">

            ${escapeHtml(
              listing.description ||
              "No description provided."
            )}

          </div>

        </div>


        ${
          detailsHtml
            ? `
              <div class="details-box">

                ${detailsHtml}

              </div>
            `
            : ""
        }


        ${
          contactHtml
            ? `
              <div class="contact-section">

                ${contactHtml}

              </div>
            `
            : ""
        }


        ${expiryHtml}

      </div>

    </div>

  `;

}


/* CHANGE PHOTO */

function changePhoto(
  element,
  photo
) {

  const mainPhoto =
    document.getElementById(
      "main-photo"
    );


  if (!mainPhoto) {
    return;
  }


  mainPhoto.src =
    photo;


  document
    .querySelectorAll(
      ".photo-thumb"
    )
    .forEach(
      function(thumb) {

        thumb.classList.remove(
          "selected"
        );

      }
    );


  element.classList.add(
    "selected"
  );

}


/* MESSAGE */

function showMessage(
  icon,
  title,
  message
) {

  content.innerHTML = `

    <div class="message">

      <div class="message-icon">
        ${icon}
      </div>

      <h2>
        ${escapeHtml(title)}
      </h2>

      <p>
        ${escapeHtml(message)}
      </p>

    </div>

  `;

}


/* SECURITY HELPERS */

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {

  return String(value)
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      "<",
      "&lt;"
    )
    .replace(
      ">",
      "&gt;"
    );

}


/* START */

loadAdvert();

</script>

</body>
</html>
