<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Join OGARS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #0b5ed7;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px 16px;
    }

    .form-card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .note {
      margin-top: 18px;
      padding: 12px;
      background: #eef4ff;
      border-radius: 8px;
      line-height: 1.5;
    }

    .button {
      width: 100%;
      border: none;
      background: #0b5ed7;
      color: white;
      padding: 14px;
      margin-top: 22px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Join OGARS</h1>
    <p>Create your worker profile and get discovered by customers.</p>
  </header>

  <div class="container">

    <div class="form-card">

      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name">

      <label>Phone Number</label>
      <input type="tel" placeholder="Enter your phone number">

      <label>Location</label>
      <input type="text" placeholder="e.g. Accra, Madina, Kasoa">

      <label>Main Skill</label>
      <select>
        <option>Select your main skill</option>
        <option>Plumbing</option>
        <option>Electrical</option>
        <option>Carpentry</option>
        <option>Painting</option>
        <option>Masonry</option>
        <option>Tiling</option>
        <option>Welding</option>
        <option>AC Repair</option>
        <option>Other</option>
      </select>

      <label>Other Skills</label>
      <textarea placeholder="You can add other skills you offer. Maximum 5 skills in total."></textarea>

      <label>Years of Experience</label>
      <input type="number" placeholder="e.g. 5">

      <label>About Your Work</label>
      <textarea placeholder="Tell customers about your experience and the type of work you do."></textarea>

      <div class="note">
        ⭐ Your profile can later include your photo, verification,
        ratings, completed jobs, availability and customer reviews.
      </div>

      <button class="button">Create Worker Profile</button>

    </div>

  </div>

  <footer>
    © 2026 OGARS Workers Platform
  </footer>

</body>
</html>
