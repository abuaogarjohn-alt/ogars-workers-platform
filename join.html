async function submitWorker() {

  const fullName = document.getElementById("full_name").value.trim();
const phone = document.getElementById("phone").value.trim();
const area = document.getElementById("area").value;
const mainSkill = document.getElementById("main_skill").value;
const yearsExperience = document.getElementById("years_experience").value.trim();

if (!fullName || !phone || !area || !mainSkill || !yearsExperience) {
  alert("Please complete your name, phone number, area, main skill, and years of experience.");
  return;
}

const worker = {
  full_name: document.getElementById("full_name").value,
  phone: document.getElementById("phone").value,
  location: document.getElementById("area").value,
  main_skill: document.getElementById("main_skill").value,
  skill_2: document.getElementById("skill_2").value,
  skill_3: document.getElementById("skill_3").value,

  skill_5: document.getElementById("skill_5").value,
  years_experience: parseInt(document.getElementById("years_experience").value),
  about_work: document.getElementById("about_work").value,
  available: true
};

    const { error } = await supabaseClient
      .from("workers")
      .insert([worker]);

    if (error) {
      alert("There was a problem saving your profile. Please try again.");
      console.error(error);
      return;
    }
