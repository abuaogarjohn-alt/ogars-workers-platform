<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7655d9"><title>OGARS Market | My Adverts</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5fc;color:#282342;font:15px Arial,sans-serif;padding-bottom:30px}a{color:inherit;text-decoration:none}button,input{font:inherit}.top{background:linear-gradient(110deg,#7655d9,#5634b0);color:white;padding:16px max(16px,calc((100% - 1050px)/2));display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:1px;font-size:19px}.top a,.top button{color:white;background:#ffffff20;border:1px solid #ffffff55;border-radius:9px;padding:9px 12px}.wrap{max-width:1050px;margin:auto;padding:22px 15px}.back{color:#6343bc;font-weight:700;display:inline-block;margin-bottom:16px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.heading h1{margin:0;color:#30245f;font-size:25px}.muted{color:#77748b;line-height:1.55}.card{background:white;border:1px solid #ece7f7;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 15px #30245f0b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:white;border:1px solid #ece7f7;border-radius:16px;padding:17px;min-height:110px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 14px #30245f0a}.ico{width:45px;height:45px;border-radius:13px;background:#f0eaff;display:grid;place-items:center;font-size:22px}.tile b{display:block;font-size:14px}.tile small{color:#77748b;display:block;margin-top:5px}.arrow{margin-left:auto;color:#7655d9;font-size:23px}.profile{display:flex;align-items:center;gap:15px;background:linear-gradient(120deg,#eee5ff,#d9c8ff);border:1px solid #dfd2ff;border-radius:20px;padding:18px;margin:18px 0}.avatar{width:70px;height:70px;border-radius:50%;background:#7655d9;color:white;display:grid;place-items:center;font-size:25px;font-weight:800;overflow:hidden;flex-shrink:0}.avatar img{width:100%;height:100%;object-fit:cover}.pill{display:inline-block;background:white;color:#5634b0;border-radius:30px;padding:6px 10px;font-size:11px;font-weight:800;margin-top:7px}.btn{display:inline-block;background:#7655d9;color:white;border:0;border-radius:9px;padding:11px 15px;font-weight:700;margin:5px 5px 0 0}.btn.secondary{background:#f0eaff;color:#5634b0}.empty{padding:22px;text-align:center;border:1px dashed #d8ccef;border-radius:13px;color:#77748b;line-height:1.6}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tab{border:1px solid #ddd4f1;border-radius:22px;background:white;padding:9px 13px;color:#5634b0;font-weight:700}.tab.active{background:#7655d9;color:white}.ad{display:grid;grid-template-columns:86px 1fr;gap:13px;align-items:center}.ad img,.photo{width:86px;height:86px;object-fit:cover;border-radius:10px;background:#f0eaff}.meta{font-size:12px;color:#77748b;line-height:1.7}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:#f7f4ff;border-radius:12px;padding:14px}.stat strong{display:block;font-size:22px;color:#5634b0}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px;font-size:13px}.field input{width:100%;padding:12px;border:1px solid #ddd5ef;border-radius:9px}.hint{font-size:12px;color:#77748b;margin-top:6px}footer{text-align:center;color:#8a869b;font-size:11px;padding:20px}@media(min-width:680px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:430px){.wrap{padding:16px 11px}.heading h1{font-size:22px}.profile{padding:14px}.avatar{width:60px;height:60px}.ad{grid-template-columns:70px 1fr}.ad img,.photo{width:70px;height:75px}.statgrid{gap:6px}.stat{padding:10px 5px}}</style></head><body><header class="top"><a class="brand" href="index.html">OGARS MARKET</a><div><a href="index.html">Home</a> <button data-signout>Sign Out</button></div></header><main class="wrap"><a class="back" href="dashboard.html">← Back to Dashboard</a><div class="heading"><div><h1>My Adverts</h1><p class="muted">Manage your published adverts and check their status.</p></div></div><div id="loading" class="card">Loading your account…</div><div id="content" hidden><div class="tabs"><button class="tab active" data-filter="active">Active</button><button class="tab" data-filter="review">Under Review</button><button class="tab" data-filter="expired">Expired</button></div><div class="statgrid" id="counts"></div><div id="list" class="card"><div class="empty">Loading adverts…</div></div><a class="btn" href="advertise.html">＋ Post an Advert</a></div></main><footer>© OGARS Market</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://pawqsmcswoypuiihfbrr.supabase.co";
const SUPABASE_KEY="sb_publishable_skeGOdL2kqtHNQwXJjmSSg_exGApfnb";
const AUTH_STORAGE_KEY="sb-pawqsmcswoypuiihfbrr-auth-token";
const authStorage={getItem(k){return localStorage.getItem(k)??sessionStorage.getItem(k)},setItem(k,v){if(localStorage.getItem(AUTH_STORAGE_KEY)){localStorage.setItem(k,v);sessionStorage.removeItem(k)}else{sessionStorage.setItem(k,v);localStorage.removeItem(k)}},removeItem(k){localStorage.removeItem(k);sessionStorage.removeItem(k)}};
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storage:authStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let user=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function photo(v){return String(v||'').split(',').map(x=>x.trim()).find(Boolean)||''}
function date(v){return v?new Date(v).toLocaleDateString(): '—'}
function status(a){const vals=['moderation_status','approval_status','review_status','listing_status','status'].map(k=>String(a[k]??'').toLowerCase());if(vals.some(v=>/pending|review|submitted|awaiting/.test(v)))return 'review';if(a.available===false)return 'unavailable';if(a.expires_at&&new Date(a.expires_at)<new Date())return 'expired';return 'active'}
async function boot(){try{const {data,error}=await db.auth.getSession();if(error)throw error;user=data.session?.user;if(!user){location.replace('account.html');return}document.querySelectorAll('[data-customer-name]').forEach(x=>x.textContent=user.user_metadata?.full_name||user.user_metadata?.name||user.email?.split('@')[0]||'OGARS Customer');document.querySelectorAll('[data-customer-email]').forEach(x=>x.textContent=user.email||'');if(typeof pageLoad==='function')await pageLoad();$('loading').hidden=true;$('content').hidden=false}catch(e){$('loading')&&($('loading').textContent='Unable to load your account. Please refresh or sign in again.')}}
async function logout(){const {error}=await db.auth.signOut();if(!error)location.href='account.html';else alert(error.message)}
document.querySelectorAll('[data-signout]').forEach(b=>b.addEventListener('click',logout));
</script><script>
let adverts=[],filter='active';async function pageLoad(){const {data,error}=await db.from('discover_listings').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error)throw error;adverts=data||[];render()}
function render(){const groups={active:adverts.filter(a=>status(a)==='active'),review:adverts.filter(a=>status(a)==='review'),expired:adverts.filter(a=>status(a)==='expired')};$('counts').innerHTML=Object.entries(groups).map(([k,v])=>`<div class="stat"><strong>${v.length}</strong>${k==='review'?'Under Review':k[0].toUpperCase()+k.slice(1)}</div>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));const rows=groups[filter];$('list').innerHTML=rows.length?rows.map(a=>{const p=photo(a.photo_urls);return `<article class="card ad">${p?`<img src="${esc(p)}" alt="Advert">`:'<div class="photo">📢</div>'}<div><b>${esc(a.title||'Untitled advert')}</b><div class="meta">${esc(a.listing_type||'Advert')} · ${esc(a.location||'Location not added')}<br>Posted ${date(a.created_at)} · Expires ${date(a.expires_at)}</div><span class="pill">${filter==='review'?'Under Review':filter==='expired'?'Expired':'Active'}</span>${filter==='expired'?`<br><a class="btn" href="advertise.html">Renew Advert</a>`:''}</div></article>`}).join(''):'<div class="empty">No '+(filter==='review'?'adverts currently under review':filter+' adverts')+' found.</div>'}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));
</script></script></body></html>
