const tiles=document.getElementById('category-tiles');tiles.innerHTML=cats.map(c=>`<a class="tile" href="phones-tablets-listings.html?subcategory=${encodeURIComponent(c[0])}"><span class="emoji" aria-hidden="true">${c[1]}</span><span><strong>${c[0]}</strong></span></a>`).join('');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function money(v){if(v===null||v===undefined||v==='')return 'Contact for price';const n=Number(String(v).replace(/[^0-9.-]/g,''));return Number.isFinite(n)?'GH₵ '+n.toLocaleString('en-GH'):esc(v)}function phoneCategoryOf(a){const d=String(a.description||'');const m=d.match(/OGARS_PHONE_CATEGORY:\s*([^\n\r]+)/i);return m?m[1].trim():''}function phones(a){const t=(String(a.title||'')+' '+String(a.description||'')).toLowerCase();const type=String(a.listing_type||'').trim().toLowerCase();const sub=/subcategory\s*:\s*phones\s*&\s*electronics/i.test(String(a.description||''));return type==='products & goods'&&(!!phoneCategoryOf(a)||sub||/(phone|tablet|ipad|iphone|samsung|tecno|infinix|xiaomi|oppo|smartwatch|earbud|headphone|charger|power bank|mobile|screen repair|phone repair|accessor)/i.test(t))}function img(a){let v=String(a.photo_urls||'').split(',')[0].trim();return v||''}function card(a){let im=img(a),ph=String(a.phone||a.whatsapp||'').replace(/[^+\d]/g,'');const priceNum=Number(String(a.price??"").replace(/[^0-9.-]/g,""));const created=Date.parse(a.created_at||"")||0;return `<article class="card" data-price="${Number.isFinite(priceNum)&&String(a.price??"").trim()!==""?priceNum:""}" data-created="${created}"><div class="photo">${im?`<img src="${esc(im)}" alt="${esc(a.title||'Phone or tablet')}" loading="lazy" onerror="this.style.display='none'">`:'<div class="placeholder">📱</div>'}</div><div class="info"><p class="price">${money(a.price)}</p><h3 class="title">${esc(a.title||'Phone or tablet advert')}</h3><p class="meta">⌖ ${esc(a.location||'Ghana')}</p><div class="contact-row">${ph?`<a href="tel:${esc(ph)}">Call seller</a>`:''}<a href="phone-tablet-details.html?id=${encodeURIComponent(a.id)}">Details</a></div></div></article>`}async function load(){let box=document.getElementById('latest');try{let {data,error}=await db.from('discover_listings').select('*').eq('listing_type','Products & Goods').order('created_at',{ascending:false}).limit(100);if(error)throw error;console.log('OGARS listings fetched:',(data||[]).length);phoneRows=(data||[]).filter(phones);console.log('OGARS phone listings matched:',phoneRows.length);applyListingControls();}catch(e){console.error(e);box.innerHTML='<div class="state">We could not load adverts right now. Please try again later.</div>'}}let phoneRows=[];function applyListingControls(){let q=document.getElementById('quick-search').value.trim().toLowerCase(),loc=document.getElementById('location-filter').value.toLowerCase(),cat=document.getElementById('category-filter').value.toLowerCase(),sort=document.getElementById('sort-filter').value;let rows=phoneRows.filter(a=>{let hay=(String(a.title||'')+' '+String(a.description||'')).toLowerCase();let okQ=!q||hay.includes(q);let okL=!loc||String(a.location||'').toLowerCase().includes(loc);let actualCat=phoneCategoryOf(a).toLowerCase();let okC=!cat||actualCat===cat||hay.includes(cat);return okQ&&okL&&okC});rows.sort((a,b)=>{if(sort==='oldest')return new Date(a.created_at||0)-new Date(b.created_at||0);if(sort==='price-low'||sort==='price-high'){let pa=Number(String(a.price||'').replace(/[^0-9.]/g,''))||0,pb=Number(String(b.price||'').replace(/[^0-9.]/g,''))||0;return sort==='price-low'?pa-pb:pb-pa}return new Date(b.created_at||0)-new Date(a.created_at||0)});let box=document.getElementById('latest');box.innerHTML=rows.length?rows.map(card).join(''):'<div class="state">No adverts match those filters yet.</div>'}
function sortLatestCards(){
 const sel=document.getElementById('sort-order');if(!sel)return;
 const box=document.getElementById('latest');const cards=Array.from(box.querySelectorAll('.card'));
 cards.sort((a,b)=>{const mode=sel.value;
 if(mode==='latest'||mode==='oldest'){const ta=Number(a.dataset.created||0),tb=Number(b.dataset.created||0);return mode==='latest'?tb-ta:ta-tb;}
 const pa=a.dataset.price===''?Number.POSITIVE_INFINITY:Number(a.dataset.price),pb=b.dataset.price===''?Number.POSITIVE_INFINITY:Number(b.dataset.price);

}
function search(){let q=document.getElementById('quick-search').value.trim(),loc=document.getElementById('location-filter').value,cat=document.getElementById('category-filter').value;let params=new URLSearchParams();if(q)params.set('search',q);if(loc)params.set('location',loc);if(cat)params.set('subcategory',cat);location.href='phones-tablets-listings.html'+(params.toString()?'?'+params.toString():'')}document.getElementById('search-btn').addEventListener('click',search);document.getElementById('quick-search').addEventListener('keydown',e=>{if(e.key==='Enter')search()});document.getElementById('year').textContent=new Date().getFullYear();document.getElementById('sort-filter').addEventListener('change',applyListingControls);document.getElementById('location-filter').addEventListener('change',applyListingControls);document.getElementById('category-filter').addEventListener('change',applyListingControls);load();</script></body></html>
