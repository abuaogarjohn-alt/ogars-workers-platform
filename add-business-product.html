<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Product - OGARS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8f5;
      color: #183b25;
    }

    header {
      background: #087f3f;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .business-name {
      background: #e8f7ee;
      border-left: 5px solid #087f3f;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd8cf;
      border-radius: 9px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .section-title {
      margin-top: 25px;
      margin-bottom: 10px;
      color: #087f3f;
      font-size: 18px;
      font-weight: bold;
    }

    .delivery-box {
      background: #f3faf5;
      border: 1px solid #cde5d5;
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .photo-button {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      background: #e8f7ee;
      color: #087f3f;
      border: 1px solid #087f3f;
      border-radius: 9px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }

    #photo-input {
      display: none;
    }

    #photo-preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .photo-item {
      position: relative;
    }

    .photo-item img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 9px;
      border: 1px solid #ddd;
    }

    .remove-photo {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #d62828;
      color: white;
      border: none;
      border-radius: 50%;
      width: 25px;
      height: 25px;
      cursor: pointer;
      font-weight: bold;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      background: #087f3f;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #7da58d;
      cursor: not-allowed;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #087f3f;
      text-decoration: none;
      font-weight: bold;
    }

    .hint {
      font-size: 13px;
      color: #66756b;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<header>
  <h1>➕ Add Product</h1>
  <p>Sell your products on OGARS</p>
</header>

<div class="container">

  <div class="card">

    <div id="business-name" class="business-name">
      Loading business...
    </div>

    <label for="product-name">Product Name</label>
    <input
      type="text"
      id="product-name"
      placeholder="e.g. Frozen Chicken"
    >

    <label for="category">Category</label>

    <select id="category">

      <option value="">Select a category</option>

      <option>Food & Groceries</option>
      <option>Frozen Foods</option>
      <option>Fresh Food & Produce</option>
      <option>Drinks & Beverages</option>

      <option>Clothing & Fashion</option>
      <option>Shoes & Footwear</option>
      <option>Bags & Accessories</option>

      <option>Beauty & Personal Care</option>
      <option>Health & Wellness</option>

      <option>Phones & Tablets</option>
      <option>Computers & Electronics</option>

      <option>Home & Kitchen</option>
      <option>Furniture</option>

      <option>Building & Construction Materials</option>
      <option>Electrical & Plumbing Materials</option>

      <option>Automotive & Spare Parts</option>
      <option>Tools & Equipment</option>

      <option>Baby & Kids</option>
      <option>Books & Stationery</option>

      <option>Sports & Fitness</option>
      <option>Agriculture & Farming</option>
      <option>Pets & Animals</option>

      <option>Office & Business Supplies</option>

      <option>Services</option>
      <option>Other</option>

    </select>

    <label for="price">Price (GH₵)</label>
    <input
      type="number"
      id="price"
      placeholder="e.g. 250"
      min="0"
    >

    <label for="description">Product Description</label>
    <textarea
      id="description"
      placeholder="Describe the product, size, quantity, condition, etc."
    ></textarea>


    <!-- DELIVERY -->

    <div class="section-title">
      🚚 Delivery Options
    </div>

    <div class="delivery-box">

      <label for="delivery-available">Delivery Available?</label>

      <select id="delivery-available">
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>


      <div id="delivery-details" class="hidden">

        <label for="delivery-fee-type">
          Delivery Fee
        </label>

        <select id="delivery-fee-type">

          <option value="">
            Select delivery fee option
          </option>

          <option value="free">
            Free Delivery
          </option>

          <option value="fixed">
            Fixed Delivery Fee
          </option>

          <option value="negotiable">
            Negotiable
          </option>

        </select>


        <div id="fixed-fee-section" class="hidden">

          <label for="delivery-fee">
            Delivery Fee (GH₵)
          </label>

          <input
            type="number"
            id="delivery-fee"
            placeholder="e.g. 30"
            min="0"
          >

        </div>


        <label for="delivery-areas">
          Delivery Areas
        </label>

        <input
          type="text"
          id="delivery-areas"
          placeholder="e.g. Accra, Madina, East Legon"
        >

        <div class="hint">
          Enter the communities or areas where you deliver.
        </div>

      </div>

    </div>


    <!-- PHOTOS -->

    <div class="section-title">
      📷 Product Photos
    </div>

    <label class="photo-button" for="photo-input">
      ➕ Add Product Photos
    </label>

    <input
      type="file"
      id="photo-input"
      accept="image/*"
      multiple
    >

    <div id="photo-preview"></div>


    <button id="post-button" onclick="addProduct()">
      Add Product
    </button>

    <a href="#" id="back-link" class="back-link">
      ← Back to Business Profile
    </a>

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://pawqsmcswoypuiihfbrr.supabase.co";

  /*
    Keep your existing Supabase publishable key
    here exactly as it was in your previous file.
  */

  const SUPABASE_KEY = "sb_publishable_skeGOdL2kqtHNQwXJjmSSg_exGApfnb";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // Get business ID from URL

  const params =
    new URLSearchParams(window.location.search);

  const businessId =
    params.get("business_id");


  if (!businessId) {

    alert("Business ID is missing.");

  }


  // Back button

  document.getElementById("back-link").href =
    "business-profile.html?id=" + businessId;


  // Load business name

  async function loadBusiness() {

    if (!businessId) return;

    const { data, error } =
      await supabaseClient
        .from("businesses")
        .select("business_name")
        .eq("id", businessId)
        .single();


    if (error) {

      console.error(error);

      document.getElementById("business-name").innerText =
        "Business not found";

      return;
    }


    document.getElementById("business-name").innerText =
      "🏢 Adding product for: " + data.business_name;

  }


  loadBusiness();


  // Delivery display

  document
    .getElementById("delivery-available")
    .addEventListener("change", function () {

      const details =
        document.getElementById("delivery-details");

      if (this.value === "yes") {

        details.classList.remove("hidden");

      } else {

        details.classList.add("hidden");

        document
          .getElementById("delivery-fee")
          .value = "";

        document
          .getElementById("delivery-areas")
          .value = "";

      }

    });


  // Fixed delivery fee display

  document
    .getElementById("delivery-fee-type")
    .addEventListener("change", function () {

      const fixedSection =
        document.getElementById("fixed-fee-section");

      if (this.value === "fixed") {

        fixedSection.classList.remove("hidden");

      } else {

        fixedSection.classList.add("hidden");

        document
          .getElementById("delivery-fee")
          .value = "";

      }

    });


  // Photos

  let selectedPhotos = [];


  document
    .getElementById("photo-input")
    .addEventListener("change", function () {

      const files =
        Array.from(this.files);

      selectedPhotos =
        selectedPhotos.concat(files);

      renderPhotoPreview();

      this.value = "";

    });


  function renderPhotoPreview() {

    const preview =
      document.getElementById("photo-preview");

    preview.innerHTML = "";


    selectedPhotos.forEach(function(file, index) {

      const item =
        document.createElement("div");

      item.className =
        "photo-item";


      const img =
        document.createElement("img");

      img.src =
        URL.createObjectURL(file);


      const removeButton =
        document.createElement("button");

      removeButton.type =
        "button";

      removeButton.className =
        "remove-photo";

      removeButton.innerText =
        "×";


      removeButton.onclick =
        function() {

          selectedPhotos.splice(index, 1);

          renderPhotoPreview();

        };


      item.appendChild(img);

      item.appendChild(removeButton);

      preview.appendChild(item);

    });

  }


  // Add product

  async function addProduct() {

    const postButton =
      document.getElementById("post-button");


    if (postButton.disabled) return;


    const productName =
      document
        .getElementById("product-name")
        .value
        .trim();


    const category =
      document
        .getElementById("category")
        .value;


    const price =
      document
        .getElementById("price")
        .value;


    const description =
      document
        .getElementById("description")
        .value
        .trim();


    const deliveryAvailable =
      document
        .getElementById("delivery-available")
        .value;


    const deliveryFeeType =
      document
        .getElementById("delivery-fee-type")
        .value;


    const deliveryFee =
      document
        .getElementById("delivery-fee")
        .value;


    const deliveryAreas =
      document
        .getElementById("delivery-areas")
        .value
        .trim();


    if (!productName || !category) {

      alert(
        "Please enter the product name and select a category."
      );

      return;

    }


    if (
      deliveryAvailable === "yes" &&
      !deliveryFeeType
    ) {

      alert(
        "Please select a delivery fee option."
      );

      return;

    }


    if (
      deliveryAvailable === "yes" &&
      deliveryFeeType === "fixed" &&
      !deliveryFee
    ) {

      alert(
        "Please enter the delivery fee."
      );

      return;

    }


    postButton.disabled = true;

    postButton.innerText =
      "Adding Product...";


    try {

      let photoUrls = [];


      // Upload photos

      for (const file of selectedPhotos) {

        const fileName =
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2, 8) +
          "-" +
          file.name.replace(
            /[^a-zA-Z0-9.-]/g,
            "-"
          );


        const { error: uploadError } =
          await supabaseClient
            .storage
            .from("business-product-photos")
            .upload(
              fileName,
              file
            );


        if (uploadError) {

          throw uploadError;

        }


        const { data: urlData } =
          supabaseClient
            .storage
            .from("business-product-photos")
            .getPublicUrl(fileName);


        photoUrls.push(
          urlData.publicUrl
        );

      }


      // Prepare delivery values

      let deliveryAvailableValue =
        deliveryAvailable === "yes";


      let deliveryFeeTypeValue =
        deliveryAvailableValue
          ? deliveryFeeType
          : null;


      let deliveryFeeValue =
        (
          deliveryAvailableValue &&
          deliveryFeeType === "fixed" &&
          deliveryFee
        )
          ? Number(deliveryFee)
          : null;


      let deliveryAreasValue =
        deliveryAvailableValue
          ? deliveryAreas
          : null;


      // Product

      const product = {

        business_id:
          Number(businessId),

        product_name:
          productName,

        category:
          category,

        price:
          price
            ? Number(price)
            : null,

        description:
          description,

        available:
          true,

        photo_urls:
          photoUrls.length > 0
            ? photoUrls.join(",")
            : null,

        delivery_available:
          deliveryAvailableValue,

        delivery_fee_type:
          deliveryFeeTypeValue,

        delivery_fee:
          deliveryFeeValue,

        delivery_areas:
          deliveryAreasValue

      };


      const { error } =
        await supabaseClient
          .from("business_products")
          .insert([product]);


      if (error) {

        throw error;

      }


      alert(
        "Product added successfully!"
      );


      window.location.href =
        "business-profile.html?id=" +
        businessId;


    } catch (error) {

      console.error(error);

      alert(
        "Error: " + error.message
      );


      postButton.disabled = false;

      postButton.innerText =
        "Add Product";

    }

  }

</script>

</body>
</html>
