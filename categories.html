<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post an advert | OGARS</title>
<style>
:root{--purple:#5420a8;--purple2:#6f2bd4;--navy:#17113f;--lav:#f0e8ff;--pale:#f8f5ff;--muted:#667085;--line:#ece7f5;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--navy);font-family:Arial,Helvetica,sans-serif;line-height:1.4}.wrap{max-width:900px;margin:auto;padding:0 16px 28px}.top{height:70px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}.back{font-size:28px;text-decoration:none;color:var(--navy);width:34px}.brand{flex:1;text-align:center;font-size:26px;font-weight:900;color:var(--purple);letter-spacing:-.6px}.brand small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}.topspace{width:34px}.hero{margin:14px 0 16px;padding:22px 20px;border-radius:16px;color:#fff;background:linear-gradient(115deg,#321078,#6c21c8);display:flex;align-items:center;justify-content:space-between;gap:14px;overflow:hidden;min-height:142px}.hero h1{font-size:clamp(25px,5vw,36px);line-height:1.1;margin:0 0 10px;max-width:440px}.hero p{margin:0;font-size:15px;color:#f0e7ff}.hero-art{font-size:58px;filter:drop-shadow(0 7px 8px #21004b66)}.searchrow{display:flex;gap:10px;margin:0 0 20px}.search{flex:1;display:flex;align-items:center;gap:10px;background:#f2edfc;border-radius:28px;padding:0 16px;min-height:52px}.search span{font-size:22px;color:var(--purple)}.search input{border:0;outline:0;background:transparent;width:100%;font:inherit;color:var(--navy);font-size:16px}.filter{width:52px;border:0;border-radius:16px;background:#f2edfc;color:var(--purple);font-size:22px}.section{margin:20px 0 24px}.section-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}.section-icon{font-size:23px;color:var(--purple)}.section-head h2{font-size:18px;margin:0;flex:1}.seeall{border:0;background:transparent;color:var(--purple);font-size:14px;font-weight:700;padding:6px 0}.grid{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}.cat{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;overflow:hidden;background:#fff;box-shadow:none;min-width:0;cursor:pointer;color:inherit;text-align:left;padding:10px 2px;display:flex;flex-direction:row;align-items:center;gap:13px}.photo{height:66px;width:66px;min-width:66px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:34px;background:linear-gradient(135deg,#f0e8ff,#faf8ff);position:relative}.photo.pink{background:linear-gradient(135deg,#ffe8f1,#fff8fb)}.photo.blue{background:linear-gradient(135deg,#e7edff,#f8faff)}.photo.green{background:linear-gradient(135deg,#e6f8f0,#f8fffb)}.catbody{padding:2px 30px 2px 0;position:relative;min-height:0;flex:1}.catbody strong{display:block;font-size:15px;line-height:1.25;padding-right:0;margin-bottom:4px}.catbody small{display:block;color:var(--muted);font-size:12px;line-height:1.35;padding-right:0}.cat .go{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:auto;height:auto;border-radius:0;background:transparent;color:#7d6a9c;display:grid;place-items:center;font-size:27px}.other{width:100%;display:flex;flex-direction:row;align-items:center;background:linear-gradient(90deg,#f0e6ff,#fbf9ff);padding:12px;gap:12px;margin-top:14px;border:1px solid #eee5ff;border-radius:15px;color:var(--navy);text-align:left}.other .othericon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#dfccff;color:var(--purple);font-size:26px}.other .othertext{flex:1}.other strong{display:block}.other small{color:var(--muted)}.other .go{position:static;flex:none}.empty{display:none;text-align:center;color:var(--muted);padding:25px}.note{text-align:center;color:#8a8498;font-size:12px;margin:22px 0 0}
@media(min-width:650px){.wrap{padding-left:24px;padding-right:24px}.photo{height:72px;width:72px;min-width:72px}.catbody{padding:2px 34px 2px 0;min-height:0}.catbody strong{font-size:16px}.catbody small{font-size:13px}.hero{padding:28px 30px}}
@media(max-width:360px){.wrap{padding-left:11px;padding-right:11px}.hero{padding:18px 14px}.hero-art{font-size:44px}.photo{height:58px;width:58px;min-width:58px;font-size:30px}.cat{gap:10px;padding:9px 1px}.catbody{padding-right:27px}.catbody strong{font-size:13px}.catbody small{font-size:11px}}
</style></head>
<body>
<header class="top wrap"><a class="back" href="index.html" aria-label="Back">‹</a><div class="brand">OGARS<small>Post an advert</small></div><div class="topspace"></div></header>
<main class="wrap">
<section class="hero"><div><h1>What do you want to post?</h1><p>Choose a category to get started.</p></div><div class="hero-art" aria-hidden="true">📣</div></section>
<div class="searchrow"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search categories..." aria-label="Search categories"></label><button class="filter" id="clearSearch" aria-label="Clear search">☷</button></div>
<div id="categorySections">
<section class="section" data-section="Property & Accommodation"><div class="section-head"><span class="section-icon">⌂</span><h2>Property & Accommodation</h2><button class="seeall" data-see="property">See all</button></div><div class="grid">
<button class="cat" data-name="Houses for Rent & Sale" data-type="Other"><div class="photo">🏡</div><div class="catbody"><strong>Houses for Rent & Sale</strong><small>Apartments, houses, land, rooms</small><span class="go">›</span></div></button>
<button class="cat" data-name="Rooms & Shared Accommodation" data-type="Other"><div class="photo green">🏢</div><div class="catbody"><strong>Rooms & Shared Accommodation</strong><small>Rooms, self-contained, shared rooms</small><span class="go">›</span></div></button>
</div></section>
<section class="section" data-section="Employment & Workers"><div class="section-head"><span class="section-icon">▣</span><h2>Employment & Workers</h2><button class="seeall" data-see="workers">See all</button></div><div class="grid">
<button class="cat" data-name="Skilled Workers" data-type="Other"><div class="photo">🧑🏾‍🔧</div><div class="catbody"><strong>Skilled Workers</strong><small>Plumbers, electricians, carpenters</small><span class="go">›</span></div></button>
<button class="cat" data-name="Jobs & Vacancies" data-type="Other"><div class="photo blue">💼</div><div class="catbody"><strong>Jobs & Vacancies</strong><small>Jobs, hire staff, work opportunities</small><span class="go">›</span></div></button>
</div></section>
<section class="section" data-section="Products & Vehicles"><div class="section-head"><span class="section-icon">🛒</span><h2>Products & Vehicles</h2><button class="seeall" data-see="products">See all</button></div><div class="grid">
<button class="cat" data-name="Products & Goods" data-type="Business Advertisement"><div class="photo pink">📱</div><div class="catbody"><strong>Products & Goods</strong><small>Electronics, fashion, food, etc.</small><span class="go">›</span></div></button>
<button class="cat" data-name="Vehicles" data-type="Other"><div class="photo blue">🚘</div><div class="catbody"><strong>Vehicles</strong><small>Cars, motorbikes, trucks, drivers</small><span class="go">›</span></div></button>
</div></section>
<section class="section" data-section="Services & Business"><div class="section-head"><span class="section-icon">✦</span><h2>Services & Business</h2><button class="seeall" data-see="services">See all</button></div><div class="grid">
<button class="cat" data-name="Services" data-type="Business Advertisement"><div class="photo green">🧰</div><div class="catbody"><strong>Services</strong><small>Business, home, personal services</small><span class="go">›</span></div></button>
<button class="cat" data-name="Restaurants & Food" data-type="Restaurant"><div class="photo pink">🍲</div><div class="catbody"><strong>Restaurants & Food</strong><small>Restaurants, food, catering</small><span class="go">›</span></div></button>
</div></section>
<section class="section" data-section="Education, Events & Others"><div class="section-head"><span class="section-icon">🎓</span><h2>Education, Events & Others</h2><button class="seeall" data-see="education">See all</button></div><div class="grid">
<button class="cat" data-name="Schools & Training" data-type="School"><div class="photo">📚</div><div class="catbody"><strong>Schools & Training</strong><small>Schools, courses, education</small><span class="go">›</span></div></button>
<button class="cat" data-name="Events & Promotions" data-type="Event"><div class="photo pink">🎪</div><div class="catbody"><strong>Events & Promotions</strong><small>Events, church programs, offers</small><span class="go">›</span></div></button>
</div></section>
<button class="other" data-name="Other" data-type="Other"><span class="othericon">•••</span><span class="othertext"><strong>Other</strong><small>Other types of adverts</small></span><span class="go">›</span></button>
<div id="empty" class="empty">No matching categories found.</div>
</div><p class="note">OGARS • Find opportunities. Connect locally.</p>
</main>
<script>
const search=document.getElementById('search');
const sections=[...document.querySelectorAll('.section')];
const cards=[...document.querySelectorAll('.cat, .other')];
const empty=document.getElementById('empty');
function filterCategories(){const q=search.value.trim().toLowerCase();let shown=0;sections.forEach(section=>{let count=0;section.querySelectorAll('.cat').forEach(card=>{const match=(card.dataset.name+' '+card.querySelector('small').textContent+' '+section.dataset.section).toLowerCase().includes(q);card.style.display=match?'flex':'none';if(match){count++;shown++;}});section.style.display=count?'block':'none';});const other=document.querySelector('.other');const otherMatch=('other other types of adverts').includes(q)||!q;other.style.display=otherMatch?'flex':'none';if(otherMatch)shown++;empty.style.display=shown?'none':'block';}
search.addEventListener('input',filterCategories);document.getElementById('clearSearch').addEventListener('click',()=>{search.value='';filterCategories();search.focus();});
function openCategory(name,type){const target='advertise.html?category='+encodeURIComponent(name)+'&type='+encodeURIComponent(type);window.location.href=target;}
cards.forEach(card=>card.addEventListener('click',()=>openCategory(card.dataset.name,card.dataset.type)));
document.querySelectorAll('[data-see]').forEach(btn=>btn.addEventListener('click',()=>{const section=btn.closest('.section');section.querySelectorAll('.cat').forEach(card=>card.style.display='flex');btn.textContent='See all';}));
</script>
</body></html>
