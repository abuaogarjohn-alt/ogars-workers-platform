<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Find a Property - OGARS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 20px;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .property-card {
      background: #fff;
      border: 1px solid #ddd;
      padding: 18px;
      margin-top: 20px;
      border-radius: 12px;
    }

    .property-gallery {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 15px;
      scroll-snap-type: x mandatory;
    }

    .property-gallery img {
      width: 240px;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
      scroll-snap-align: center;
    }

    .button {
      display: inline-block;
      padding: 12px 18px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 10px;
    }

    .contact {
      display: inline-block;
      padding: 12px 18px;
      background: #008000;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>🏠 Find a Property</h1>
  <p>Find houses, apartments, rooms, hotels, land and commercial properties.</p>
</header>

<div class="container">

  <div class="section">

    <h2>🔎 Search Properties</h2>

    <input
      type="text"
      id="property-search"
      placeholder="Search by property name or location"
    >

    <select id="property-type-filter">
      <option value="">All Property Types</option>
      <option value="House">House</option>
      <option value="Apartment">Apartment / Flat</option>
      <option value="Room">Room</option>
      <option value="Student Housing">Student Housing</option>
      <option value="Hotel">Hotel</option>
      <option value="Short Stay">Short Stay</option>
      <option value="Shop">Shop</option>
      <option value="Office">Office</option>
      <option value="Warehouse">Warehouse</option>
      <option value="Commercial Space">Commercial Space</option>
      <option value="Land">Land</option>
      <option value="Other">Other</option>
    </select>

    <select id="listing-type-filter">
      <option value="">Rent or Sale</option>
      <option value="Rent">For Rent</option>
      <option value="Sale">For Sale</option>
    </select>

    <div id="property-list">
      Loading properties...
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://pawqsmcswoypuiihfbrr.supabase.co";

const SUPABASE_KEY = "sb_publishable_skeGOdL2kqtHNQwXJjmSSg_exGApfnb";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadProperties() {

  const { data, error } = await supabaseClient
    .from("properties")
    .select("*")
    .eq("available", true)
    .order("created_at", { ascending: false });

  const list = document.getElementById("property-list");

  if (error) {
    list.innerHTML = "Unable to load properties.";
    console.error(error);
    return;
  }

  list.innerHTML = "";

  if (!data || data.length === 0) {
    list.innerHTML = "<p>No properties available at the moment.</p>";
    return;
  }

  data.forEach(property => {

    const card = document.createElement("div");

    card.className = "property-card";

    card.innerHTML = `

      ${property.photo_url ? `
        <div class="property-gallery">
          ${property.photo_url.split(",").map(photo => `
            <img
              src="${photo}"
              alt="${property.title}"
            >
          `).join("")}
        </div>
      ` : ""}

      <h2>🏠 ${property.title}</h2>

      <p>
        📍 <strong>Location:</strong>
        ${property.location}
      </p>

      <p>
        🏷️ <strong>Type:</strong>
        ${property.property_type}
      </p>

      <p>
        📌 <strong>Listing:</strong>
        ${property.listing_type}
      </p>

      <p>
        💰 <strong>Price:</strong>
        ${property.price ? property.price : "Contact owner"}
        ${property.price_period ? " " + property.price_period : ""}
      </p>

      ${
        (
          property.property_type === "House" ||
          property.property_type === "Apartment" ||
          property.property_type === "Short Stay"
        )
        ? `
          ${
            property.bedrooms !== null &&
            property.bedrooms !== undefined
              ? `<p>🛏️ <strong>Bedrooms:</strong> ${property.bedrooms}</p>`
              : ""
          }

          ${
            property.bathrooms !== null &&
            property.bathrooms !== undefined
              ? `<p>🚿 <strong>Bathrooms:</strong> ${property.bathrooms}</p>`
              : ""
          }
        `
        : ""
      }

      ${
        property.furnished
          ? `<p>🛋️ <strong>Furnished:</strong> ${property.furnished}</p>`
          : ""
      }

      ${
        property.room_type
          ? `<p>🛏️ <strong>Room Type:</strong> ${property.room_type}</p>`
          : ""
      }

      ${
        property.distance_to_school
          ? `<p>🎓 <strong>Distance to School:</strong> ${property.distance_to_school}</p>`
          : ""
      }

      ${
        property.land_size
          ? `<p>🌍 <strong>Land Size:</strong> ${property.land_size}</p>`
          : ""
      }

      ${
        property.floor_size
          ? `<p>📐 <strong>Floor Size:</strong> ${property.floor_size}</p>`
          : ""
      }

      <p>
        <strong>✨ Facilities:</strong>
        ${property.facilities || "Not specified"}
      </p>

      <a
        class="button"
        href="property-details.html?id=${property.id}"
      >
        👀 View Property
      </a>

      <a
        class="contact"
        href="tel:${property.contact_phone}"
      >
        📞 Contact
      </a>
    `;

    list.appendChild(card);

  });
}


function filterProperties() {

  const search = document
    .getElementById("property-search")
    .value
    .toLowerCase()
    .trim();

  const propertyType = document
    .getElementById("property-type-filter")
    .value
    .toLowerCase();

  const listingType = document
    .getElementById("listing-type-filter")
    .value
    .toLowerCase();

  const cards = document.querySelectorAll(".property-card");

  cards.forEach(card => {

    const text = card.textContent.toLowerCase();

    const matchesSearch =
      !search || text.includes(search);

    const matchesPropertyType =
      !propertyType || text.includes(propertyType);

    const matchesListingType =
      !listingType || text.includes(listingType);

    card.style.display =
      matchesSearch &&
      matchesPropertyType &&
      matchesListingType
        ? "block"
        : "none";

  });
}


document
  .getElementById("property-search")
  .addEventListener("input", filterProperties);

document
  .getElementById("property-type-filter")
  .addEventListener("change", filterProperties);

document
  .getElementById("listing-type-filter")
  .addEventListener("change", filterProperties);


loadProperties();

</script>

</body>
</html>
